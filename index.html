<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="3D 装箱排程" />
    <title>3D 装箱排程</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
    />
    <script>
      addEventListener("load", function () {
        var t = document.createElement("i");
        t.className = "ri-check-line";
        t.style.cssText = "position:absolute;visibility:hidden";
        document.body.appendChild(t);
        var f = getComputedStyle(t, ":before").fontFamily.toLowerCase();
        t.remove();
        if (f.indexOf("remixicon") < 0) {
          var l = document.createElement("link");
          l.rel = "stylesheet";
          l.href = "vendor/remixicon.css";
          document.head.appendChild(l);
        }
      });
    </script>
    <style>
      :root {
        --face: #eeede8;
        --face-dark: #e2e1db;
        --line: #aaaead;
        --light: #fff;
        --ink: #263443;
        --muted: #697580;
        --blue: #245886;
        --blue-deep: #153b60;
        --blue-soft: #e5eef5;
        --paper: #fff;
        --ok: #36764c;
        --warn: #8b5d16;
        --danger: #a23532;
        --sidebar: 218px;
        --properties: 216px;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--face);
        color: var(--ink);
        font:
          13px Tahoma,
          "ClassicCN",
          "Microsoft YaHei",
          "SimSun",
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        color: #979a9c;
      }
      input,
      select,
      textarea {
        border: 1px solid #a2a8ad;
        border-top-color: #7f8a92;
        border-left-color: #7f8a92;
        border-radius: 0;
        background: #fff;
        min-height: 26px;
        padding: 3px 7px;
        box-shadow: inset 1px 1px 0 #e2e5e7;
        outline: none;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: #2d6da1;
        box-shadow: inset 0 0 0 1px #b4d1e7;
      }
      input:disabled,
      select:disabled {
        background: #f1f1ee;
        color: #888;
      }
      input[type="checkbox"],
      input[type="radio"] {
        min-height: 0;
        box-shadow: none;
        width: 13px;
        height: 13px;
        padding: 0;
        margin: 0 5px 0 0;
        accent-color: var(--blue);
        vertical-align: -2px;
        cursor: pointer;
      }
      input[type="range"] {
        box-shadow: none;
        background: transparent;
        padding: 0;
        accent-color: var(--blue);
      }
      input[type="color"] {
        width: 22px;
        height: 22px;
        min-height: 0;
        padding: 1px;
        box-shadow: none;
        cursor: pointer;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      button:focus-visible {
        outline: 1px dotted #183e5b;
        outline-offset: -4px;
      }
      ::selection {
        background: #c5dbed;
      }
      ::-webkit-scrollbar {
        width: 15px;
        height: 15px;
      }
      ::-webkit-scrollbar-track {
        background: #eeefec;
        border-left: 1px solid #d0d3d3;
      }
      ::-webkit-scrollbar-thumb {
        background: #d6d8d5;
        border: 1px solid #a7adad;
        box-shadow: inset 1px 1px 0 #f7f8f6;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #c5cbc9;
      }
      ::-webkit-scrollbar-corner {
        background: var(--face);
      }
      [v-cloak],
      .hidden {
        display: none !important;
      }
      .icon {
        width: 18px;
        height: 18px;
        flex: none;
        display: inline-block;
        vertical-align: middle;
        object-fit: contain;
        border: 0;
      }
      .icon.small {
        width: 15px;
        height: 15px;
      }
      .icon.large {
        width: 30px;
        height: 30px;
      }
      .muted {
        color: var(--muted);
      }
      .mono {
        font-family: Consolas, "Courier New", monospace;
        font-variant-numeric: tabular-nums;
      }
      .numeric {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .nowrap {
        white-space: nowrap;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .empty-caption {
        padding: 22px 16px;
        text-align: center;
        color: var(--muted);
        line-height: 1.8;
      }
      .text-button {
        border: 0;
        background: none;
        padding: 0;
        color: var(--blue);
        text-decoration: underline;
      }
      .bevel {
        border: 1px solid #989f9f;
        box-shadow:
          inset 1px 1px 0 #fff,
          inset -1px -1px 0 #d6d7d2;
      }
      .classic-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        min-height: 27px;
        padding: 3px 12px;
        border: 1px solid #89949c;
        background: linear-gradient(#fcfcfa, #e2e4df);
        box-shadow:
          inset 1px 1px 0 #fff,
          inset -1px -1px 0 #d2d6d6;
        border-radius: 2px;
        white-space: nowrap;
      }
      .classic-button:hover:not(:disabled) {
        border-color: #56809e;
        background: linear-gradient(#fff, #e6eef3);
      }
      .classic-button:active:not(:disabled) {
        box-shadow: inset 1px 1px 2px #9ba9b0;
        background: #dce6ed;
      }
      .classic-button.primary {
        border-color: #365e7f;
        background: linear-gradient(#5482a5, #346286);
        box-shadow: inset 1px 1px 0 #789bb7;
        color: #fff;
      }
      .classic-button.primary:hover:not(:disabled) {
        background: linear-gradient(#6392b4, #3d7097);
      }
      .classic-button.primary:disabled {
        background: #b6bec3;
        box-shadow: none;
        color: #e8edef;
        border-color: #9ba6ad;
      }
      .classic-button.danger {
        color: var(--danger);
      }
      .classic-button.compact {
        padding: 2px 7px;
        min-height: 24px;
      }
      .flat-button {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border: 1px solid transparent;
        background: transparent;
        min-height: 27px;
        padding: 4px 7px;
        border-radius: 1px;
      }
      .flat-button:hover:not(:disabled) {
        border-color: #a3b5c4;
        background: #e4edf4;
      }
      .flat-button:active:not(:disabled) {
        border-color: #7594ae;
        background: #d3e2ee;
      }
      .flat-button.current {
        background: #d9e6ef;
        border-color: #7896ac;
        box-shadow: inset 1px 1px 1px #b6c8d5;
      }
      .v-separator {
        height: 23px;
        width: 1px;
        margin: 0 5px;
        border-left: 1px solid #b8bebd;
        box-shadow: 1px 0 0 #fff;
        flex: none;
      }
      .tag {
        font-size: 11px;
        padding: 1px 5px;
        border: 1px solid #b6c4cb;
        background: #edf3f5;
        color: #456678;
        white-space: nowrap;
      }
      .tag.warning {
        background: #fff4d8;
        border-color: #d5ba7b;
        color: var(--warn);
      }
      .tag.good {
        background: #e9f2e8;
        border-color: #b6ccb1;
        color: var(--ok);
      }
      .desktop-shell {
        height: 100%;
        min-height: 540px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .titlebar {
        height: 33px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 12px;
        background: linear-gradient(90deg, #173c60, #365d7d);
        color: #fff;
        border-bottom: 1px solid #102a40;
      }
      .titlebar strong {
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .titlebar .title-plan {
        font-size: 12px;
        color: #cfdce6;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 40vw;
      }
      .menubar {
        height: 29px;
        flex: none;
        display: flex;
        align-items: center;
        background: var(--face);
        padding: 0 6px;
        border-bottom: 1px solid #c4c9c7;
        position: relative;
        z-index: 50;
      }
      .menu-wrap {
        position: relative;
      }
      .menu-trigger {
        height: 25px;
        padding: 2px 12px;
        background: none;
        border: 1px solid transparent;
        min-width: 58px;
      }
      .menu-trigger:hover,
      .menu-trigger.open {
        border-color: #8ba5b9;
        background: #dce9f3;
      }
      .dropdown {
        position: absolute;
        top: 27px;
        left: 0;
        width: 260px;
        background: #f6f6f3;
        border: 1px solid #87949d;
        box-shadow: 2px 3px 0 #0002;
        z-index: 60;
        padding: 3px;
      }
      .dropdown-item {
        display: flex;
        align-items: center;
        width: 100%;
        text-align: left;
        gap: 9px;
        min-height: 29px;
        border: 1px solid transparent;
        padding: 4px 7px;
        background: none;
      }
      .dropdown-item:hover:not(:disabled) {
        background: #dbe9f5;
        border-color: #90b1c9;
      }
      .dropdown-item .shortcut {
        margin-left: auto;
        font:
          11px Tahoma,
          sans-serif;
        color: #77828a;
      }
      .menu-separator {
        height: 1px;
        background: #c1c7c6;
        margin: 4px 6px 4px 28px;
      }
      .menubar-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        color: #78848b;
        font-size: 11px;
        padding-right: 8px;
        gap: 10px;
      }
      .toolbar {
        height: 48px;
        flex: none;
        padding: 4px 9px 5px;
        display: flex;
        align-items: center;
        gap: 3px;
        border-bottom: 1px solid #9ea7ac;
        box-shadow: inset 0 1px 0 #fff;
        background: linear-gradient(#f8f8f4, #e8e9e3);
      }
      .tool-button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 33px;
        padding: 5px 9px;
        border: 1px solid transparent;
        background: transparent;
        white-space: nowrap;
      }
      .tool-button .icon {
        width: 21px;
        height: 21px;
      }
      .tool-button:hover:not(:disabled) {
        border: 1px solid #8ba7bb;
        background: #e2edf4;
        box-shadow: inset 1px 1px 0 #fff;
      }
      .tool-button:active:not(:disabled) {
        background: #d7e5ef;
        border-color: #7496af;
        box-shadow: inset 1px 1px 1px #b4cbdc;
      }
      .tool-button:disabled .icon,
      .flat-button:disabled .icon,
      .dropdown-item:disabled .icon {
        filter: grayscale(1);
        opacity: 0.45;
      }
      .tool-button.run {
        padding: 5px 14px;
        border: 1px solid #54758d;
        background: linear-gradient(#f7fbff, #d9e7f2);
        box-shadow: inset 1px 1px 0 #fff;
        color: #234f73;
      }
      .toolbar .toolbar-spacer {
        flex: 1;
      }
      .toolbar-note {
        font-size: 11px;
        color: #7b858c;
        white-space: nowrap;
        margin: 0 7px;
      }
      .main-frame {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: 5px;
        padding: 5px 5px 0;
        background: #d7dbdb;
      }
      .sidebar {
        width: var(--sidebar);
        flex: none;
        min-width: 180px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #f7f8f5;
        border: 1px solid #94a0a6;
        box-shadow: inset 1px 1px 0 #fff;
      }
      .pane-heading {
        height: 29px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 9px;
        font-weight: 600;
        font-size: 12px;
        background: linear-gradient(#f5f6f3, #e0e4e1);
        border-bottom: 1px solid #b0b9ba;
      }
      .pane-heading .flat-button {
        min-height: 20px;
        padding: 0 2px;
      }
      .plan-filter {
        padding: 9px 8px 8px;
      }
      .search-field {
        position: relative;
        display: flex;
        align-items: center;
      }
      .search-field input {
        width: 100%;
        padding-left: 25px;
        font-size: 12px;
        height: 27px;
      }
      .search-field > .icon {
        position: absolute;
        left: 6px;
        width: 14px;
        height: 14px;
        opacity: 0.65;
      }
      .search-field .clear-search {
        position: absolute;
        right: 2px;
        border: none;
        background: none;
        color: #81929a;
        padding: 2px 4px;
        font-size: 16px;
      }
      .plan-tree {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 0 5px 10px;
      }
      .tree-folder {
        height: 28px;
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        padding: 0 4px;
        color: #4c606c;
        white-space: nowrap;
      }
      .tree-folder .tree-count {
        font-size: 11px;
        color: #84939b;
        margin-left: auto;
      }
      .tree-branch {
        margin-left: 11px;
        padding-left: 8px;
        border-left: 1px dotted #a4b1b8;
      }
      .plan-entry {
        display: flex;
        align-items: center;
        gap: 6px;
        text-align: left;
        background: none;
        border: 1px solid transparent;
        width: 100%;
        min-height: 31px;
        padding: 5px;
        position: relative;
      }
      .plan-entry:before {
        position: absolute;
        content: "";
        width: 7px;
        border-top: 1px dotted #a4b1b8;
        left: -8px;
        top: 14px;
      }
      .plan-entry:hover {
        background: #e8eef1;
        border-color: #c2d0d8;
      }
      .plan-entry.active {
        background: #dce9f5;
        border-color: #91b1c9;
        color: #174d74;
      }
      .plan-entry .plan-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
      }
      .plan-entry .tiny-dot {
        margin-left: auto;
        flex: none;
        width: 5px;
        height: 5px;
        background: #af7b22;
      }
      .plan-meta {
        margin: 0 0 6px 27px;
        padding: 2px 0 5px 10px;
        border-left: 1px dotted #afbec7;
        color: #7a8993;
        font-size: 11px;
        line-height: 2;
      }
      .plan-meta span {
        display: block;
        white-space: nowrap;
      }
      .tree-empty {
        margin: 10px 10px 15px 19px;
        font-size: 11px;
        color: #8a959b;
        line-height: 1.8;
      }
      .library-controls {
        height: 35px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 3px 6px;
        border-top: 1px solid #bec6c8;
        background: #eeefeb;
      }
      .library-controls .flat-button {
        font-size: 11px;
      }
      .sidebar-info {
        padding: 11px 11px 10px;
        border-top: 1px solid #d2d8d6;
        background: #f2f4f0;
        font-size: 11px;
        color: #71818c;
        line-height: 1.8;
      }
      .sidebar-info b {
        display: block;
        color: #526674;
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 3px;
      }
      .sidebar-info .unit-note {
        margin-top: 7px;
        font-family: Tahoma, sans-serif;
        font-size: 10px;
        letter-spacing: 0.5px;
        color: #8b989e;
      }
      .workspace {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        border: 1px solid #8f9ea6;
        box-shadow: inset 1px 1px 0 #fff;
        background: var(--face);
      }
      .document-bar {
        height: 49px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        background: #f9faf7;
        border-bottom: 1px solid #c0c7c8;
      }
      .document-bar .doc-icon {
        width: 24px;
        height: 24px;
      }
      .document-bar .doc-label {
        font-size: 11px;
        color: #748590;
      }
      .document-bar .plan-name {
        border: 1px solid transparent;
        box-shadow: none;
        background: transparent;
        font-size: 15px;
        font-weight: 600;
        padding: 3px 4px;
        min-width: 0;
        width: 320px;
        max-width: 45vw;
      }
      .document-bar .plan-name:hover {
        border-color: #c2cdd3;
        background: #fff;
      }
      .document-bar .plan-name:focus {
        border-color: #7195b1;
        background: #fff;
      }
      .document-bar .doc-meta {
        margin-left: auto;
        text-align: right;
        font-size: 11px;
        color: #7b8b93;
        white-space: nowrap;
      }
      .doc-meta .save-state {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 5px;
      }
      .doc-meta .saved-time {
        font:
          10px Tahoma,
          sans-serif;
        margin-top: 3px;
        color: #9aa5aa;
      }
      .tabbar {
        height: 39px;
        display: flex;
        align-items: flex-end;
        gap: 3px;
        flex: none;
        padding: 6px 10px 0;
        background: #e5e8e5;
        border-bottom: 1px solid #95a4ad;
      }
      .workspace-tab {
        position: relative;
        height: 32px;
        min-width: 150px;
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
        padding: 5px 17px;
        border: 1px solid #b0b9bc;
        border-bottom: 0;
        background: linear-gradient(#f0f1ed, #e0e3df);
        box-shadow: inset 1px 1px 0 #fff;
        color: #697983;
        font-size: 12px;
        border-radius: 2px 2px 0 0;
      }
      .workspace-tab.active {
        height: 34px;
        background: #f7f8f5;
        color: #204e70;
        border-color: #8e9fa9;
        box-shadow: inset 0 2px 0 #3c729a;
        transform: translateY(1px);
        z-index: 2;
        font-weight: 600;
      }
      .workspace-tab .tab-number {
        font:
          11px Tahoma,
          sans-serif;
        color: #98a4ab;
        border-right: 1px solid #bdc6c8;
        padding-right: 9px;
      }
      .workspace-tab.active .tab-number {
        color: #477da4;
      }
      .workspace-tab .tab-status {
        font-size: 10px;
        font-weight: 400;
        margin-left: 0;
        color: #8d979b;
      }
      .workspace-tab.active .tab-status {
        color: #5682a2;
      }
      .tabbar .unit-label {
        margin-left: auto;
        align-self: center;
        font-size: 11px;
        color: #89979d;
        margin-bottom: 5px;
        padding-right: 5px;
      }
      .page-area {
        flex: 1;
        min-height: 0;
        position: relative;
        overflow: hidden;
        background: #f7f8f5;
      }
      .page {
        height: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .page-intro {
        min-height: 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 16px 8px;
        border-bottom: 1px solid #d9dedd;
        background: #f8f9f6;
        flex: none;
        gap: 12px;
      }
      .page-intro h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      .page-intro p {
        font-size: 11px;
        color: #819098;
        margin: 0;
        line-height: 1.6;
      }
      .page-body-scroll {
        overflow: auto;
        flex: 1;
        min-height: 0;
        padding: 15px 16px;
      }
      .groupbox {
        border: 1px solid #b9c3c6;
        margin: 0;
        padding: 13px 13px 12px;
        min-width: 0;
        box-shadow: inset 1px 1px 0 #fff;
      }
      .groupbox legend {
        padding: 0 7px;
        font-size: 12px;
        font-weight: 600;
        color: #496575;
      }
      .section-toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
        min-height: 25px;
      }
      .section-toolbar .section-tip {
        margin-left: auto;
        color: #8a989e;
        font-size: 11px;
      }
      .grid-frame {
        border: 1px solid #9cabb3;
        overflow: auto;
        background: #fff;
        box-shadow: inset 1px 1px 0 #e0e5e7;
      }
      .data-grid {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 12px;
        table-layout: fixed;
      }
      .data-grid th {
        height: 31px;
        background: linear-gradient(#f6f7f3, #e5e8e5);
        border-bottom: 1px solid #a9b5bb;
        border-right: 1px solid #c8cece;

        }
        .diagram-specs strong {
          font-size: 12px;
        }
        .diagram-specs > div {
          padding: 7px;
        }
        .container-table {
          min-width: 570px;
        }
        .cargo-commandbar {
          padding: 5px 6px;
          gap: 1px;
          height: 40px;
        }
        .cargo-commandbar .classic-button {
          padding: 3px 6px;
          font-size: 11px;
        }
        .cargo-commandbar .classic-button .icon {
          display: none;
        }
        .cargo-commandbar .search-field {
          width: 140px;
        }
        .cargo-grid-wrap {
          margin: 7px 6px 0;
        }
        .cargo-totals {
          margin: 0 6px 7px;
          padding: 6px;
          gap: 10px;
          font-size: 10px;
          overflow: auto;
          white-space: nowrap;
        }
        .cargo-totals .totals-spacer {
          display: none;
        }
        .property-content {
          grid-template-columns: 305px 200px 230px;
          overflow: auto;
          gap: 10px;
        }
        .property-pane {
          height: 210px;
        }
        .property-title .property-name {
          max-width: 135px;
        }
        .property-title .flat-button {
          font-size: 10px;
        }
        .result-summary {
          padding: 5px 7px;
          min-height: 51px;
        }
        .summary-item {
          padding: 0 8px;
        }
        .summary-item .summary-label {
          font-size: 9px;
        }
        .summary-item strong {
          font-size: 14px;
        }
        .summary-item strong small {
          font-size: 9px;
        }
        .summary-item:nth-child(4) {
          display: none;
        }
        .result-layout {
          grid-template-columns: minmax(0, 1fr) 205px;
        }
        .result-metrics {
          padding: 7px 9px;
        }
        .metric-grid {
          gap: 2px 10px;
        }
        .metric-grid > div {
          font-size: 9px;
        }
        .detail-tab {
          font-size: 10px;
          padding: 5px;
        }
        .detail-heading {
          padding: 0 8px;
        }
        .detail-heading span {
          display: none;
        }
        .view-toolbar .flat-button {
          padding: 2px 5px;
          font-size: 10px;
        }
        .view-toolbar .view-label {
          display: none;
        }
        .step-controlbar {
          padding: 5px 7px;
          gap: 4px;
          font-size: 10px;
          height: 41px;
        }
        .step-controlbar .step-label {
          display: none;
        }
        .visual-footnote {
          font-size: 9px;
          padding: 4px 8px;
          flex-wrap: wrap;
          gap: 2px;
        }
        .visual-footnote .numeric {
          display: none;
        }
        .loading-step-entry {
          gap: 5px;
          padding: 6px;
          min-height: 49px;
        }
        .step-idx {
          width: 12px;
          font-size: 9px;
        }
        .step-thumb {
          width: 28px;
          height: 29px;
        }
        .step-entry-text strong {
          font-size: 10px;
        }
        .step-entry-text small {
          font-size: 9px;
        }
        .step-quantity {
          font-size: 10px;
        }
        .statusbar .status-storage,
        .statusbar .status-total {
          display: none;
        }
        .modal-backdrop {
          padding: 12px;
        }
        .dialog-content {
          padding: 16px;
        }
        .dialog-actions {
          padding: 10px 11px;
          gap: 5px;
        }
        .dialog-actions .classic-button {
          min-width: 65px;
          padding: 3px 8px;
          font-size: 11px;
        }
        .help-body {
          padding: 13px 15px;
          font-size: 11px;
        }
        .help-tabs {
          padding: 6px 7px 0;
        }
        .help-tabs button {
          padding: 6px 10px;
        }
        .property-title .property-spacer {
          margin-left: auto;
        }
        .empty-window-content {
          padding: 20px;
        }
        .canvas-wrap {
          min-height: 180px;
        }
      }
      @media (max-width: 480px) {
        .result-layout {
          grid-template-columns: minmax(0, 1fr) 160px;
        }
        .step-thumb {
          display: none;
        }
        .result-container-tab {
          padding: 4px 7px;
          font-size: 10px;
        }
        .container-result-tabs {
          padding: 5px;
        }
        .view-toolbar .flat-button {
          padding: 2px 3px;
        }
        .view-toolbar {
          gap: 0;
          padding: 3px;
        }
        .view-toolbar .view-reset {
          display: none;
        }
        .metric-grid strong {
          font-size: 11px;
        }
        .summary-item {
          padding: 0 7px;
        }
        .summary-item strong {
          font-size: 13px;
        }
        .summary-item:first-child {
          flex: 0.55;
        }
        .summary-item .summary-label {
          font-size: 8px;
        }
        .summary-item:nth-child(3) {
          flex: 1.15;
        }
        .step-controlbar {
          flex-wrap: wrap;
          height: 53px;
          padding: 5px;
          gap: 3px;
        }
        .step-controlbar input {
          order: 3;
          flex-basis: 100%;
          height: 14px;
          min-height: 14px;
        }
        .step-controlbar .step-number {
          width: auto;
          flex: 1;
        }
        .visual-footnote {
          display: none;
        }
        .document-bar .plan-name {
          width: 190px;
        }
        .document-bar .doc-meta {
          font-size: 9px;
        }
        .container-side {
          grid-template-columns: 1fr;
        }
        .page-intro p {
          max-width: 275px;
        }
        .container-diagram svg {
          height: 150px;
        }
        .diagram-specs {
          grid-template-columns: 1fr 1fr;
        }
        .diagram-specs > div:nth-child(2) {
          border-right: 0;
        }
        .diagram-specs > div:nth-child(-n + 2) {
          border-bottom: 1px solid #d6e0e3;
        }
        .property-title .property-name {
          max-width: 100px;
        }
        .property-title .batch-label {
          display: none;
        }
        .dropdown {
          width: 245px;
        }
        .dropdown-item {
          font-size: 11px;
        }
        .cargo-commandbar .search-field {
          width: 107px;
        }
        .cargo-commandbar .classic-button {
          padding: 3px 5px;
        }
        .empty-window-content > .icon {
          display: none;
        }
        .empty-window-content h2 {
          font-size: 13px;
        }
        .summary-item strong small {
          margin-left: 1px;
        }
        .detail-tab .mini-count {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .indeterminate-bar:after {
          animation: none;
          left: 20%;
        }
      }
      @media print {
        .titlebar,
        .menubar,
        .toolbar,
        .sidebar,
        .document-bar,
        .tabbar,
        .statusbar,
        .modal-backdrop,
        .toast {
          display: none !important;
        }
        .main-frame {
          padding: 0;
          background: #fff;
        }
        .workspace {
          border: 0;
        }
        .desktop-shell {
          overflow: visible;
          height: auto;
        }
        .page-area {
          overflow: visible;
        }
        .page {
          height: auto;
        }
        .container-layout {
          display: block;
        }
        .container-side {
          margin-top: 20px;
        }
        .data-grid th {
          position: static;
        }
        .cargo-grid-wrap {
          overflow: visible;
          max-height: none;
        }
        .property-pane {
          height: auto;
        }
        .property-content {
          overflow: visible;
        }
        .result-layout {
          display: block;
        }
        .result-details {
          display: none;
        }
        .canvas-wrap {
          height: 500px;
        }
        .visual-footnote {
          display: block;
        }
      }

      /* Actual PDF pages, independent of the browser PDF plug-in. */
      .pdf-document {
        flex: 1;
        min-height: 0;
        overflow: auto;
        background: #c7d0d3;
        padding: 17px 18px 24px;
        position: relative;
      }
      .pdf-reader-status {
        margin: 20px auto;
        padding: 15px 18px;
        max-width: 650px;
        background: #f6f8f1;
        border: 1px solid #99adba;
        font-size: 12px;
        color: #5c7c8f;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .pdf-page {
        width: max-content;
        max-width: 100%;
        min-height: 500px;
        margin: 0 auto 23px;
        background: #fff;
        box-shadow: 0 1px 5px #2540582e;
        position: relative;
        padding-bottom: 23px;
        overflow: hidden;
      }
      .pdf-page canvas {
        display: block;
        max-width: 100%;
        height: auto !important;
      }
      .pdf-page-placeholder {
        min-height: 400px;
        min-width: 280px;
        width: clamp(280px, 70vw, 840px);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #91a4af;
        font-size: 12px;
      }
      .pdf-page-label {
        position: absolute;
        bottom: 5px;
        left: 0;
        width: 100%;
        text-align: center;
        font:
          10px Tahoma,
          "ClassicCN",
          sans-serif;
        color: #9cabb2;
      }
      .pdf-fallback {
        font-size: 10px;
      }
      @media (max-width: 720px) {
        .pdf-document {
          padding: 12px 8px 18px;
        }
        .pdf-page {
          max-width: 100%;
        }
        .pdf-page-placeholder {
          min-width: 230px;
          width: calc(100vw - 50px);
        }
      }

      /* User-supplied PNG icons; retain button geometry and accessible text. */
      .search-field .clear-search {
        display: flex;
        align-items: center;
        justify-content: center;
        top: 0;
        bottom: 0;
        padding: 0 3px;
      }
      .search-field .clear-search .icon {
        width: 12px;
        height: 12px;
      }
      .dialog-titlebar .dialog-close .icon {
        width: 12px;
        height: 12px;
      }

      /* Four-step mixed pallet workflow */
      .orientation-thumb svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .pallet-next {
        padding: 8px 10px;
        border: 1px solid #bdcbd1;
        background: #f4f7f2;
        font-size: 11px;
        color: #6b899b;
        line-height: 1.7;
      }
      .pallet-next p {
        margin: 7px 0;
      }
      .pallet-stage-toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 15px;
        flex-wrap: wrap;
      }
      .pallet-stage-toolbar label {
        margin-right: auto;
      }
      .pallet-groups-table {
        min-width: 950px;
      }
      .pallet-groups-table td {
        white-space: nowrap;
      }
      .pallet-disabled-note {
        padding: 12px;
        background: #eef3e9;
        border: 1px solid #c3d0bd;
        margin-bottom: 15px;
        color: #76916b;
      }
      .pallet-ledger {
        max-width: 900px;
        margin: 25px 0;
      }
      .pallet-ledger h3 {
        font-size: 12px;
        color: #567b92;
        font-weight: 400;
      }
      .good-text {
        color: #658265;
      }
      .warning-text {
        color: #a16f38;
      }
      .pallet-editor-backdrop {
        padding: 10px;
        z-index: 80;
      }
      .pallet-editor-window {
        width: min(1560px, 100%);
        height: calc(100vh - 20px);
        display: flex;
        flex-direction: column;
        border: 1px solid #60839a;
        background: #f4f7f0;
        box-shadow: 5px 5px 0 #0002;
        overflow: hidden;
      }
      .pallet-editor-window iframe {
        width: 100%;
        flex: 1;
        min-height: 0;
        border: 0;
      }
      .pallet-editor-window .dialog-titlebar {
        flex: none;
      }

      /* Visible result state instead of a silent empty-cabinet first frame. */
      .preview-count {
        display: block;
        color: #426782;
        margin-top: 3px;
      }
      .preview-pending {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 7;
        background: #ffffee;
        border: 1px solid #9bafbb;
        padding: 9px 15px;
        font-size: 12px;
        color: #456984;
        pointer-events: none;
      }
      .step-controlbar .classic-button.current {
        background: #dceaf4;
        border-color: #7c9bb0;
        color: #235476;
      }
      .view-toolbar .view-reset {
        font-size: 11px;
        white-space: nowrap;
      }
      @media (max-width: 480px) {
        .view-toolbar .view-reset {
          display: inline-flex;
          font-size: 9px;
          padding: 2px 3px;
        }
        .view-toolbar .view-reset .icon {
          display: none;
        }
        .preview-count {
          max-width: 130px;
          font-size: 9px;
        }
        .step-controlbar .classic-button {
          padding: 2px 5px;
          font-size: 9px;
        }
      }

      /* Reserved WebView2 caption buttons; the host implements window commands. */
      .titlebar {
        padding-right: 6px;
        position: relative;
        z-index: 150;
      }
      .titlebar strong {
        flex-shrink: 0;
      }
      .window-controls {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 3px;
        flex-shrink: 0;
      }
      .window-controls .window-button {
        width: 30px;
        height: 23px;
        min-height: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #173d5d;
        background: linear-gradient(#557998, #355b7b);
        box-shadow:
          inset 1px 1px 0 #7593a9,
          inset -1px -1px 0 #274b68;
      }
      .window-controls .window-button:hover {
        background: linear-gradient(#7397b5, #466e91);
      }
      .window-controls .window-button:active {
        box-shadow: inset 1px 1px 0 #274b68;
      }
      .window-controls .window-button:focus-visible {
        outline: 1px dotted #fff;
        outline-offset: -4px;
      }
      .window-controls .window-close:hover {
        background: linear-gradient(#bd756b, #9b5147);
      }
      .window-controls .icon {
        width: 13px;
        height: 13px;
      }
      .orientation-choice.placeholder {
        cursor: default;
      }
      .orientation-choice.placeholder .orientation-thumb {
        opacity: 0.9;
      }
      .pallet-next .classic-button {
        display: flex;
        margin-top: 8px;
      }
      @media (max-width: 720px) {
        .titlebar {
          padding-right: 5px;
        }
        .window-controls {
          gap: 2px;
        }
        .window-controls .window-button {
          width: 28px;
          height: 23px;
        }
      }

      /* Reuse an existing layout; deliberately keep the classic table/dialog style. */
      .dialog-window.reuse-window {
        width: 570px;
        max-width: 100%;
      }
      .reuse-content {
        font-size: 11px;
        line-height: 1.7;
      }
      .reuse-content h2 {
        margin: 0 0 9px;
        font-size: 15px;
      }
      .reuse-counts {
        margin: 6px 0 12px;
      }
      .reuse-pool-table {
        max-height: 245px;
        overflow: auto;
        border: 1px solid #a9bcc6;
      }
      .reuse-pool-table table {
        width: 100%;
        min-width: 340px;
      }
      .reuse-pool-table td:first-child {
        white-space: normal;
        word-break: break-word;
      }
      .reuse-errors {
        max-height: 155px;
        overflow: auto;
        padding-left: 18px;
        margin: 10px 0 0;
      }
      .reuse-note {
        color: #718c9c;
        margin: 10px 0 0;
      }

      /* Official Remix Icon vectors only for the three window command slots. */
      .window-controls .window-button .ri {
        font-size: 16px;
        line-height: 1;
        flex: none;
      }
      .window-controls .window-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .window-controls .window-button {
        color: #f1f6fa;
      }
      .container-diagram-empty {
        min-height: 175px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: #8799a6;
      }

      @media (min-width: 1025px) {
        .container-diagram svg {
          height: 260px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" v-cloak></div>
    <noscript>请启用脚本后运行程序。</noscript>
    <template id="app-template"
      ><div class="desktop-shell" @pointerdown="closeContextIfOutside">
        <header class="titlebar">
          <app-icon name="cube"></app-icon><strong>3D 装箱排程</strong
          ><span class="title-plan">— {{ planName || "未命名方案" }}{{ dirty ? " *" : "" }}</span>
          <div class="window-controls" role="group" aria-label="窗口操作">
            <button
              type="button"
              id="window-minimize-button"
              class="window-button"
              data-window-command="minimize"
              title="最小化"
              aria-label="最小化"
            >
              <i class="ri ri-subtract-line" aria-hidden="true"></i>
            </button>
            <button
              type="button"
              id="window-restore-button"
              class="window-button"
              data-window-command="restore"
              title="还原"
              aria-label="还原"
            >
              <i class="ri ri-checkbox-multiple-blank-line" aria-hidden="true"></i>
            </button>
            <button
              type="button"
              id="window-close-button"
              class="window-button window-close"
              data-window-command="close"
              title="关闭"
              aria-label="关闭"
            >
              <i class="ri ri-close-line" aria-hidden="true"></i>
            </button>
          </div>
        </header>
        <div class="menu-overlay" v-if="openMenu || contextMenu" @pointerdown="closeMenus"></div>
        <nav class="menubar" :inert="showPalletEditor" aria-label="应用菜单">
          <div class="menu-wrap" v-for="menu in menus" :key="menu.key">
            <button
              class="menu-trigger"
              :class="{ open: openMenu === menu.key }"
              @click.stop="toggleMenu(menu.key)"
              @mouseenter="openMenu && (openMenu = menu.key)"
              :aria-expanded="openMenu === menu.key"
            >
              {{ menu.label }}
            </button>
            <div class="dropdown" v-if="openMenu === menu.key" role="menu">
              <template v-for="(command, index) in menu.items" :key="index">
                <div v-if="command.separator" class="menu-separator"></div>
                <button
                  v-else
                  class="dropdown-item"
                  role="menuitem"
                  @click="invokeMenu(command)"
                  :disabled="command.disabled"
                >
                  <app-icon :name="command.icon || 'new'"></app-icon><span>{{ command.label }}</span
                  ><span class="shortcut">{{ command.shortcut }}</span>
                </button>
              </template>
            </div>
          </div>
        </nav>
        <div class="toolbar" :inert="showPalletEditor" role="toolbar" aria-label="主要操作">
          <button
            class="tool-button"
            @click="createNewPlan"
            :disabled="calculating"
            title="新建空白方案 (Ctrl+N)"
          >
            <app-icon name="new"></app-icon><span class="tool-label">新建</span>
          </button>
          <button
            class="tool-button"
            @click="saveCurrentPlan"
            :disabled="calculating"
            title="保存到方案库 (Ctrl+S)"
          >
            <app-icon name="save"></app-icon><span class="tool-label">保存方案</span>
          </button>
          <span class="v-separator"></span>
          <button
            class="tool-button"
            @click="triggerExcelImport"
            :disabled="calculating"
            title="导入 Excel / XLS / CSV 货物清单"
          >
            <app-icon name="import"></app-icon><span class="tool-label">导入货物</span>
          </button>
          <button
            class="tool-button"
            @click="exportItemsExcel"
            :disabled="!items.length || calculating"
            title="导出完整货物清单与约束 (.xlsx)"
          >
            <app-icon name="export"></app-icon><span class="tool-label">导出货物</span>
          </button>
          <span class="v-separator"></span>
          <button
            class="tool-button run"
            @click="calculating ? cancelJob() : runCalc()"
            :title="calculating ? '取消当前后台任务' : '检查输入并计算装箱方案 (F5)'"
            data-testid="run-button"
          >
            <app-icon :name="calculating ? 'stop' : 'calculate'"></app-icon
            ><span class="tool-label">{{ calculating ? "取消任务" : "计算装箱" }}</span>
          </button>
          <button
            class="tool-button"
            @click="generateStepsPreview"
            :disabled="!resultsReady || calculating"
            title="生成中文 PDF：清单、全装图与分步图"
            data-testid="pdf-button"
          >
            <app-icon name="pdf"></app-icon><span class="tool-label">装箱报告</span>
          </button>
          <span class="toolbar-spacer"></span><span class="toolbar-note">F5 计算　Ctrl+S 保存</span>
          <button class="tool-button" @click="sidebarOpen = !sidebarOpen" title="显示 / 隐藏方案栏">
            <app-icon name="sidebar"></app-icon>
          </button>
          <button class="tool-button" @click="openHelp('guide')" title="使用帮助 (F1)">
            <app-icon name="help"></app-icon>
          </button>
        </div>
        <input
          class="hidden"
          type="file"
          ref="excelFileInput"
          accept=".xlsx,.xls,.csv"
          @change="handleExcelImport"
          aria-label="导入货物文件"
        />
        <input
          class="hidden"
          type="file"
          ref="projectFileInput"
          accept=".json,.jzx"
          @change="handleProjectImport"
          aria-label="导入方案文件"
        />
        <div class="main-frame" :inert="showPalletEditor">
          <aside
            class="sidebar"
            :class="{ 'force-open': sidebarOpen && !wideViewport }"
            v-show="sidebarOpen"
            aria-label="方案管理"
          >
            <div class="pane-heading">
              <span>方案资源管理器</span
              ><button class="flat-button" @click="sidebarOpen = false" title="收起方案栏">
                <app-icon name="sidebar" class="small"></app-icon>
              </button>
            </div>
            <div class="plan-filter">
              <div class="search-field">
                <app-icon name="search"></app-icon
                ><input
                  v-model="planSearch"
                  placeholder="查找已保存方案…"
                  aria-label="查找方案"

                    <app-icon name="edit" class="small"></app-icon><span>装载属性</span
                    ><span class="property-name">{{
                      selectedItem ? selectedItem.name || "未命名货物" : "未选择货物"
                    }}</span
                    ><span class="property-spacer"></span
                    ><button
                      class="flat-button"
                      @pointerdown.stop
                      @click="openBatch"
                      :disabled="!selectedItem || calculating"
                    >
                      <app-icon name="batch" class="small"></app-icon
                      ><span class="batch-label">批量应用…</span></button
                    ><button
                      class="flat-button"
                      @pointerdown.stop
                      @click="propertiesCollapsed = !propertiesCollapsed"
                      :title="propertiesCollapsed ? '展开属性区' : '收起属性区'"
                    >
                      <app-icon
                        :name="propertiesCollapsed ? 'chevron-up' : 'chevron-down'"
                        class="small"
                      ></app-icon>
                    </button>
                  </div>
                  <div class="property-content" v-if="!propertiesCollapsed">
                    <fieldset class="groupbox">
                      <legend>允许装载方向</legend>
                      <div class="orientation-grid">
                        <label
                          v-for="orientation in orientationOptions"
                          :key="orientation.key"
                          class="orientation-choice"
                          :class="{
                            active: !!selectedItem?.[orientation.key],
                            placeholder: !selectedItem,
                          }"
                          :title="orientation.description"
                          ><input
                            type="checkbox"
                            :checked="!!selectedItem?.[orientation.key]"
                            @change="
                              selectedItem &&
                              (selectedItem[orientation.key] = $event.target.checked)
                            "
                            :disabled="!selectedItem || calculating"
                            :aria-label="`${selectedItem?.name || '未选择货物'} ${orientation.label}`"
                          /><span
                            class="orientation-thumb"
                            v-html="getThumb(selectedItem, orientation.key)"
                          ></span
                          ><span class="orientation-label">{{ orientation.label }}</span></label
                        >
                      </div>
                      <p class="constraint-hint" v-if="selectedItem">仅勾选的方向参与装载。</p>
                    </fieldset>
                    <fieldset class="groupbox" v-if="selectedItem">
                      <legend>堆叠与装载顺序</legend>
                      <div class="property-row">
                        <span class="field-label">最多堆叠</span
                        ><input
                          type="number"
                          min="0"
                          step="1"
                          v-model.number="selectedItem.maxStack"
                          :disabled="calculating"
                          aria-label="最多堆叠层数"
                        /><span class="small-note">层，0 不限</span>
                      </div>
                      <label class="property-row check-row"
                        ><input
                          type="checkbox"
                          v-model="selectedItem.noOverstack"
                          :disabled="calculating"
                        />不可堆叠（上方禁止放货）</label
                      ><label class="property-row check-row"
                        ><input
                          type="checkbox"
                          v-model="selectedItem.noUnderstack"
                          :disabled="calculating"
                        />必须置底（不可放在其他货物上）</label
                      >
                      <div class="property-row">
                        <span class="field-label">装载顺序</span
                        ><input
                          type="number"
                          min="0"
                          step="1"
                          v-model.number="selectedItem.priority"
                          :disabled="calculating"
                          aria-label="装载顺序"
                        /><span class="small-note">1 最先，0 自动</span>
                      </div>
                    </fieldset>
                    <div class="pallet-next" v-if="selectedItem">
                      <b>组合打托</b
                      ><button class="classic-button" @click="goStep(3)">
                        <app-icon name="pallet" class="small"></app-icon>进入组合打托
                      </button>
                    </div>
                  </div>
                </div>
              </section>
              <!-- 03 Optional mixed-pallet assembly; transactional editor in a separate HTML -->
              <section class="page" v-show="step === 3" aria-label="组合打托">
                <div class="page-intro">
                  <div>
                    <h1>混合组合打托（可选）</h1>
                    <p>
                      按件选择任意货物，自由摆放并验证支撑；托盘计入厚度、自重及承载。库存未打托余量继续散装。
                    </p>
                  </div>
                  <button class="classic-button" @click="skipPalletStage" :disabled="calculating">
                    跳过打托 → 第四步
                  </button>
                </div>
                <div class="page-body-scroll pallet-stage">
                  <div class="pallet-stage-toolbar">
                    <label
                      ><input
                        type="checkbox"
                        v-model="usePalletGroups"
                        :disabled="calculating"
                      />启用以下组合参与装载</label
                    ><button
                      class="classic-button primary"
                      @click="openPalletEditor()"
                      :disabled="calculating"
                    >
                      <app-icon name="plus" class="small"></app-icon>新建混合组合</button
                    ><button class="classic-button" @click="goStep(4)">下一步：装载结果</button>
                  </div>
                  <div class="validation-strip error" v-if="palletErrors.length">
                    <app-icon name="warning" class="small"></app-icon
                    >{{ palletErrors.length }} 项组合问题，F5 计算前请修正。
                  </div>
                  <div class="pallet-disabled-note" v-if="!usePalletGroups">
                    当前跳过打托，全部按散件计算。组合配置保留；勾选启用后才扣减组合用量。
                  </div>
                  <div class="grid-frame">
                    <table class="data-grid pallet-groups-table">
                      <thead>
                        <tr>
                          <th>参与</th>
                          <th>组合名称</th>
                          <th>托数</th>
                          <th>件 / 托</th>
                          <th>外廓 长×宽×高 mm</th>
                          <th>kg / 托</th>
                          <th>托盘</th>
                          <th>校验 / 旋转</th>
                          <th>操作</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr v-for="g in palletGroups" :key="g.id">
                          <td>
                            <input
                              type="checkbox"
                              v-model="g.enabled"
                              :disabled="calculating"
                              :aria-label="g.name + ' 参与组合'"
                            />
                          </td>
                          <td>{{ g.name }}</td>
                          <td class="numeric">{{ g.copies }}</td>
                          <td class="numeric">
                            {{ g.members.length
                            }}<template v-if="palletCustomCopies(g)">
                              · {{ palletCustomCopies(g) }} 托单设</template
                            >
                          </td>
                          <td class="numeric">
                            {{ fmt(palletInfo(g).summary.length) }} ×
                            {{ fmt(palletInfo(g).summary.width) }} ×
                            {{ fmt(palletInfo(g).summary.height) }}
                          </td>
                          <td class="numeric">{{ fmt(palletInfo(g).summary.weight) }}</td>
                          <td>{{ g.pallet ? "实体，含自重" : "无底板组合" }}</td>
                          <td
                            :class="palletInfo(g).valid ? 'good-text' : 'warning-text'"
                            :title="
                              palletInfo(g)
                                .errors.map((e) => e.message)
                                .join('；')
                            "
                          >
                            {{ palletInfo(g).valid ? "通过" : "需修正" }} ·
                            {{ palletInfo(g).summary.yaw90Allowed ? "可水平旋转" : "固定朝向" }} ·
                            {{ palletInfo(g).summary.stackable ? "可承托" : "不承托" }}
                          </td>
                          <td>
                            <button
                              class="flat-button"
                              @click="openPalletEditor(g)"
                              :disabled="calculating"
                            >
                              编辑</button
                            ><button
                              class="flat-button"
                              @click="openPalletReuse(g)"
                              :disabled="calculating"
                            >
                              复用</button
                            ><button
                              class="flat-button"
                              @click="removePalletGroup(g.id)"
                              :disabled="calculating"
                            >
                              删除
                            </button>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                    <div class="empty-caption" v-if="!palletGroups.length">
                      还没有组合。可以创建一托混合货物，也可以直接跳过本步。
                    </div>
                  </div>
                  <div class="pallet-ledger">
                    <h3>库存预留与散件余量</h3>
                    <table class="data-grid">
                      <thead>
                        <tr>
                          <th>货物</th>
                          <th>参与库存</th>
                          <th>组合预留</th>
                          <th>剩余散件</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr v-for="it in validItems" :key="it.uid">
                          <td>{{ it.name }}</td>
                          <td>{{ it.qty }}</td>
                          <td>{{ palletReservations.get(it.uid) || 0 }}</td>
                          <td
                            :class="
                              it.qty - (palletReservations.get(it.uid) || 0) < 0
                                ? 'warning-text'
                                : ''
                            "
                          >
                            {{ it.qty - (palletReservations.get(it.uid) || 0) }}
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  <div class="info-note">
                    <app-icon name="info"></app-icon
                    ><span
                      >组合内逐件朝向、堆叠与顺序沿用第二步。整托保持竖直，只在所有单件允许时水平转
                      90°。整托无不可堆叠货物、且完整支撑并满足限层/承载时可叠放；不在组合顶面放散件。实际承压、重心及绑扎需人工复核。</span
                    >
                  </div>
                </div>
              </section>
              <!-- 03 Stable result snapshot, container tabs, preview & focused detail tabs -->
              <section
                class="page"
                v-show="step === 4"
                aria-label="装箱结果"
                style="position: relative"
              >
                <div class="stale-banner" v-if="results.length && resultsStale">
                  <app-icon name="warning" class="small"></app-icon
                  ><span>参数已改变；以下是上次计算结果。请重新计算后再导出报告。</span
                  ><button class="text-button" @click="runCalc" :disabled="calculating">
                    F5 更新
                  </button>
                </div>
                <div class="result-summary">
                  <div class="summary-item">
                    <div class="summary-label">使用货柜</div>
                    <strong>{{ results.length }}<small>柜</small></strong>
                  </div>
                  <div class="summary-item">
                    <div class="summary-label">已装 / 参与</div>
                    <strong
                      >{{ fmt(resultSummary.placed)
                      }}<small>/ {{ fmt(resultSummary.total) }} 件</small></strong
                    >
                  </div>
                  <div class="summary-item">
                    <div class="summary-label">综合体积利用率</div>
                    <strong>{{ resultSummary.volumeRate.toFixed(1) }}<small>%</small></strong>
                  </div>
                  <div class="summary-item">
                    <div class="summary-label">装载总重量</div>
                    <strong>{{ fmt(resultSummary.weight) }}<small>kg</small></strong>
                  </div>
                  <div class="summary-item" :class="{ warning: globalUnplacedList.length }">
                    <div class="summary-label">未装入</div>
                    <strong>{{ fmt(resultSummary.unplaced) }}<small>件</small></strong>
                  </div>
                </div>
                <div class="fallback-banner" v-if="previewFallback">当前使用兼容视图。</div>
                <div class="result-layout">
                  <div class="visual-pane">
                    <div class="result-tabs-wrap">
                      <button
                        type="button"
                        class="tab-scroll left"
                        @click="scrollResultTabs(-1)"
                        aria-label="向左切换货柜"
                        title="向左切换货柜"
                      >
                        <i class="ri ri-arrow-left-s-line" aria-hidden="true"></i>
                      </button>
                      <div
                        class="container-result-tabs"
                        ref="resultTabsEl"
                        aria-label="计算结果货柜"
                      >
                        <button
                          v-for="(result, index) in results"
                          :key="index"
                          class="result-container-tab"
                          :class="{ active: activeResultIndex === index }"
                          @click="switchResult(index)"
                        >
                          <app-icon name="cube" class="small"></app-icon
                          ><span class="container-idx">#{{ index + 1 }}</span
                          >{{ result.containerName }}</button
                        ><span
                          class="muted"
                          v-if="!results.length"
                          style="font-size: 11px; padding-left: 4px"
                          >货柜列表</span
                        >
                      </div>
                      <button
                        type="button"
                        class="tab-scroll right"
                        @click="scrollResultTabs(1)"
                        aria-label="向右切换货柜"
                        title="向右切换货柜"
                      >
                        <i class="ri ri-arrow-right-s-line" aria-hidden="true"></i>
                      </button>
                    </div>
                    <div class="view-toolbar" role="toolbar" aria-label="视图切换">
                      <span class="view-label">视图</span
                      ><button
                        v-for="view in viewOptions"
                        :key="view.key"
                        class="flat-button"
                        :class="{ current: viewMode === view.key }"
                        @click="setView(view.key)"
                        :disabled="!activeRes"
                      >
                        {{ view.label }}</button
                      ><button
                        class="flat-button view-reset"
                        @click="refreshResultPreview()"
                        :disabled="!activeRes"
                        title="重新绘制货物并显示完整装载"
                      >
                        <app-icon name="reset" class="small"></app-icon>刷新预览
                      </button>
                    </div>
                    <div class="canvas-wrap" ref="canvasWrap">
                      <div class="view-caption">
                        <strong>{{
                          activeRes
                            ? `${activeRes.containerName} / ${viewOptions.find((v) => v.key === viewMode)?.label || ""}`
                            : "装载预览"
                        }}</strong
                        ><span v-if="activeRes" class="preview-count"
                          >{{ fullResultView ? "完整装载" : "逐步装载" }} · 当前显示
                          {{ fmt(previewCargoCount) }} 件</span
                        >
                      </div>
                      <div class="preview-pending" v-if="activeRes && previewState !== 'ready'">
                        正在绘制装载货物…
                      </div>
                      <div class="hover-tooltip hidden" ref="hoverTooltip"></div>
                    </div>
                    <div class="step-controlbar">
                      <span class="step-label">装载步骤</span
                      ><button
                        class="classic-button compact"
                        @click="showLoadingStep(loadingStepIndex - 1)"
                        :disabled="!activeLoadingSteps.length || loadingStepIndex <= 0"
                        title="上一步"
                      >
                        <app-icon name="arrow-left" class="small"></app-icon></button
                      ><span class="step-number"
                        >{{ activeLoadingSteps.length ? loadingStepIndex + 1 : 0 }} /
                        {{ activeLoadingSteps.length }}</span
                      ><input
                        type="range"
                        min="0"
                        :max="Math.max(0, activeLoadingSteps.length - 1)"
                        :value="loadingStepIndex"
                        @input="showLoadingStep(Number($event.target.value))"
                        :disabled="!activeLoadingSteps.length"
                        aria-label="装载步骤"
                      /><button
                        class="classic-button compact"
                        @click="showLoadingStep(loadingStepIndex + 1)"
                        :disabled="
                          !activeLoadingSteps.length ||
                          loadingStepIndex >= activeLoadingSteps.length - 1
                        "
                        title="下一步"
                      >
                        <app-icon name="arrow-right" class="small"></app-icon></button
                      ><button
                        class="classic-button compact"
                        @click="resetLoadingPreview"
                        :disabled="!activeLoadingSteps.length"
                        title="显示完整装载结果"
                        :class="{ current: fullResultView }"
                      >
                        完整装载
                      </button>
                    </div>
                    <div class="visual-footnote">
                      <span>{{
                        previewFallback
                          ? "兼容视图 · 使用按钮切换方向"
                          : "左键旋转 · 滚轮缩放 · 右键 / 中键平移 · 悬停查看货物"
                      }}</span
                      ><span class="numeric" v-if="activeRes"
                        >{{ fmt(activeRes.containerLength) }} ×
                        {{ fmt(activeRes.containerWidth) }} ×
                        {{ fmt(activeRes.containerHeight) }} mm</span
                      >
                    </div>
                  </div>
                  <aside class="result-details" aria-label="结果明细">
                    <div class="detail-heading">
                      <app-icon name="chart" class="small"></app-icon
                      ><strong>{{ activeRes ? activeRes.containerName : "货柜状态" }}</strong
                      ><span v-if="activeRes">#{{ activeResultIndex + 1 }}</span>
                    </div>
                    <div class="result-metrics">
                      <div class="metric-line">
                        <span>体积利用率</span
                        ><b>{{ (activeRes?.volumeRate || 0).toFixed(1) }} %</b>
                      </div>
                      <div class="metric-meter">
                        <div
                          class="meter-fill"
                          :style="{ width: Math.min(100, activeRes?.volumeRate || 0) + '%' }"
                        ></div>
                      </div>
                      <div class="metric-line">
                        <span>载重利用率</span
                        ><b>{{ (activeRes?.weightRate || 0).toFixed(1) }} %</b>
                      </div>
                      <div class="metric-meter green">
                        <div
                          class="meter-fill"
                          :style="{ width: Math.min(100, activeRes?.weightRate || 0) + '%' }"
                        ></div>
                      </div>
                      <div class="metric-grid">
                        <div>
                          已装数量<strong>{{ fmt(activeRes?.placedCount || 0) }} 件</strong>
                        </div>
                        <div>
                          装载重量<strong>{{ fmt(activeRes?.totalWeight || 0) }} kg</strong>
                        </div>
                        <div>
                          已用长度<strong>{{ fmt(activeRes?.usedLength || 0) }} mm</strong>
                        </div>
                        <div>
                          尾部余深<strong>{{ fmt(activeRes?.tailSpace || 0) }} mm</strong>
                        </div>
                      </div>
                    </div>
                    <div class="detail-tabs" role="tablist" aria-label="结果明细类别">
                      <button
                        class="detail-tab"
                        :class="{ active: resultDetailTab === 'steps' }"
                        @click="resultDetailTab = 'steps'"
                      >
                        步骤 <span class="mini-count">{{ loadingStepList.length }}</span></button
                      ><button
                        class="detail-tab"
                        :class="{ active: resultDetailTab === 'cargo' }"
                        @click="resultDetailTab = 'cargo'"
                      >
                        配载</button
                      ><button
                        class="detail-tab"
                        :class="{
                          active: resultDetailTab === 'unplaced',
                          warning: globalUnplacedList.length,
                        }"
                        @click="resultDetailTab = 'unplaced'"
                      >
                        未装入 <span class="mini-count">{{ globalUnplacedList.length }}</span>
                      </button>
                    </div>
                    <div
                      class="detail-body"
                      v-if="resultDetailTab === 'steps'"
                      @mouseleave="clearLoadingStepHighlight"
                    >
                      <button
                        class="loading-step-entry"
                        v-for="loadStep in loadingStepList"
                        :key="loadStep.stepIndex"
                        :class="{ active: loadStep.stepIndex === loadingStepIndex }"
                        @click="showLoadingStep(loadStep.stepIndex)"
                        @mouseenter="highlightLoadingStep(loadStep.stepIndex)"
                      >
                        <span class="step-idx">{{
                          String(loadStep.stepIndex + 1).padStart(2, "0")
                        }}</span
                        ><app-icon
                          :name="loadStep.palletized ? 'pallet' : 'cargo'"
                          class="step-thumb"
                        ></app-icon
                        ><span class="step-entry-text"
                          ><strong>{{ loadStep.name }}</strong
                          ><small>{{
                            loadStep.palletized
                              ? `${loadStep.unitCount} 托 · ${loadStep.totalPieces} 件`
                              : `${loadStep.unitCount} 个装载单元`
                          }}</small></span
                        ><span class="step-quantity">{{ loadStep.totalPieces }} 件</span>
                      </button>
                      <div class="empty-caption" v-if="!loadingStepList.length">
                        该货柜没有装载步骤。
                      </div>
                    </div>
                    <div class="detail-body" v-else-if="resultDetailTab === 'cargo'">
                      <div class="allocation-list">
                        <div
                          v-for="cargo in activeAllocation"
                          :key="cargo.name"
                          class="allocation-row"
                        >
                          <span class="color-swatch" :style="{ background: cargo.color }"></span
                          ><span class="allocation-name" :title="cargo.name">{{ cargo.name }}</span
                          ><span class="allocation-count">{{ fmt(cargo.qty) }} 件</span>
                        </div>
                        <div class="empty-caption" v-if="!activeAllocation.length">
                          无已装货物。
                        </div>
                      </div>
                      <div class="info-note" style="padding: 0 11px">
                        <app-icon name="info"></app-icon
                        ><span>数量已包含打托内的原始货物件数。</span>
                      </div>
                    </div>
                    <div class="detail-body" v-else>
                      <div class="unplaced-note" v-if="globalUnplacedList.length">
                        全方案未装入货物。下方原因基于输入检查；其他情况请复核空间、朝向和堆叠条件。
                      </div>
                      <div
                        class="unplaced-row"
                        v-for="cargo in globalUnplacedList"
                        :key="cargo.name"
                      >
                        <div class="unplaced-title">
                          <span>{{ cargo.name }}</span
                          ><span class="mono">{{ fmt(cargo.qty) }} 件</span>
                        </div>
                        <small>{{ unplacedReason(cargo.name) }}</small>
                      </div>
                      <div class="empty-caption" v-if="!globalUnplacedList.length">
                        <app-icon name="check" class="large"></app-icon><br />{{
                          results.length ? "参与货物已全部装入。" : "暂无未装入数据。"
                        }}
                      </div>
                    </div>
                  </aside>
                </div>
                <div class="result-empty" v-if="!hasCalculated && !calculating">
                  <div class="empty-window">
                    <div class="empty-window-title">
                      <app-icon name="calculate" class="small"></app-icon>装箱计算
                    </div>
                    <div class="empty-window-content">
                      <app-icon name="cube"></app-icon>
                      <div>
                        <h2>准备好清单，再开始计算</h2>
                        <p>
                          当前已选 {{ selectedContainers.length }} 种货柜，{{ validItems.length }}
                          种货物，共
                          {{ fmt(totalPieces) }}
                          件。<br />计算后可检查多柜配载、逐步装载和未装入清单。
                        </p>
                        <button class="classic-button primary" @click="runCalc">
                          <app-icon name="calculate" class="small"></app-icon>开始计算
                          <span style="opacity: 0.65; margin-left: 6px; font-size: 10px">F5</span>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
                <div
                  class="result-empty"
                  :style="resultsStale ? { top: '31px' } : {}"
                  v-else-if="hasCalculated && !results.length && !calculating"
                >
                  <div class="empty-window">
                    <div class="empty-window-title">
                      <app-icon name="warning" class="small"></app-icon>没有可用的装载方案
                    </div>
                    <div class="empty-window-content">
                      <app-icon name="warning"></app-icon>
                      <div>
                        <h2>参与货物均未能装入</h2>
                        <p v-for="cargo in globalUnplacedList" :key="cargo.name">
                          {{ cargo.name }}：{{ fmt(cargo.qty) }} 件<br />{{
                            unplacedReason(cargo.name)
                          }}
                        </p>
                        <button class="classic-button" @click="goStep(2)">返回货物清单检查</button>
                      </div>
                    </div>
                  </div>
                </div>
              </section>
            </div>
          </main>
        </div>
        <footer class="statusbar">

    <script id="shared-pallet-visual">
      /* Visual-only, four-way wooden pallet. All parts stay within the supplied envelope.
   The solver still reserves length × width × thickness and uses the entered tare/load. */
      function palletVisualParts(length, thickness, width, yaw90 = false) {
        const L = Number(yaw90 ? width : length),
          W = Number(yaw90 ? length : width),
          H = Number(thickness);
        if (![L, W, H].every((v) => Number.isFinite(v) && v > 0)) return [];
        const parts = [],
          bottom = H * 0.14,
          block = H * 0.56,
          bearer = H * 0.12,
          deck = H - bottom - block - bearer;
        const bx = L * 0.14,
          bz = W * 0.16,
          xs = [bx / 2, L / 2, L - bx / 2],
          zs = [bz / 2, W / 2, W - bz / 2];
        const add = (role, x, y, z, dx, dy, dz, tone) =>
          parts.push({ role, x, y, z, dx, dy, dz, tone });
        for (const z of zs) add("bottom-runner", 0, 0, z - bz / 2, L, bottom, bz, -7);
        for (const x of xs)
          for (const z of zs)
            add("support-block", x - bx / 2, bottom, z - bz / 2, bx, block, bz, -12);
        for (const x of xs) add("cross-bearer", x - bx / 2, bottom + block, 0, bx, bearer, W, -3);
        const gap = W * 0.022,
          plank = (W - gap * 4) / 5;
        for (let k = 0; k < 5; k++)
          add("deck-board", 0, H - deck, k * (plank + gap), L, deck, plank, k % 2 ? 6 : 0);
        if (yaw90)
          return parts.map((p) => ({ ...p, x: p.z, z: L - p.x - p.dx, dx: p.dz, dz: p.dx }));
        return parts;
      }
      let palletGrainTexture = null;
      function getPalletGrainTexture() {
        if (palletGrainTexture) return palletGrainTexture;
        const canvas =
          typeof document !== "undefined"
            ? document.createElement("canvas")
            : new OffscreenCanvas(256, 64);
        canvas.width = 256;
        canvas.height = 64;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#bb976a";
        ctx.fillRect(0, 0, 256, 64);
        for (let row = 0; row < 47; row++) {
          const y = row * 1.37;
          ctx.strokeStyle = row % 3 ? "rgba(87,58,29,.12)" : "rgba(244,219,177,.20)";
          ctx.lineWidth = row % 5 === 0 ? 0.8 : 0.35;
          ctx.beginPath();
          ctx.moveTo(0, y);
          for (let x = 0; x <= 256; x += 16) ctx.lineTo(x, y + Math.sin(x * 0.032 + row) * 0.7);
          ctx.stroke();
        }
        ctx.strokeStyle = "rgba(85,58,32,.22)";
        ctx.lineWidth = 0.5;
        ctx.beginPath();

        palletGrainTexture.encoding = THREE.sRGBEncoding;
        palletGrainTexture.wrapS = palletGrainTexture.wrapT = THREE.RepeatWrapping;
        return palletGrainTexture;
      }
      function createPalletVisual(
        length,
        thickness,
        width,
        { yaw90 = false, swapAxes = false, highlighted = true } = {},
      ) {
        const parts = palletVisualParts(length, thickness, width, yaw90),
          group = new THREE.Group();
        group.userData.palletStructure = {
          length: Number(length),
          width: Number(width),
          thickness: Number(thickness),
          parts,

          normals = [],
          uvs = [],
          colors = [];

            geo = box.toNonIndexed();

          const rgb = new THREE.Color(highlighted ? 0xffffff : 0xe0d6c7).multiplyScalar(
              1 + p.tone / 110,
            ),
            count = geo.attributes.position.count;
          positions.push(...geo.attributes.position.array);
          normals.push(...geo.attributes.normal.array);
          uvs.push(...geo.attributes.uv.array);
          for (let n = 0; n < count; n++) colors.push(rgb.r, rgb.g, rgb.b);
          geo.dispose();
          box.dispose();
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
        geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.computeBoundingBox();
        geometry.computeBoundingSphere();

          geometry,
          new THREE.MeshStandardMaterial({
            map: getPalletGrainTexture(),
            vertexColors: true,
            roughness: 0.9,
            metalness: 0,

        group.add(wood);
