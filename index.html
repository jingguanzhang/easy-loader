              previewObserver = null,
              previewWorkerUrl = null;
            const previewRendered = new Set(),
              previewRenderTasks = new Set();
            function destroyPdfPreview() {
              previewGeneration++;
              previewObserver?.disconnect();
              previewObserver = null;
              for (const task of previewRenderTasks) {
                try {
                  task.cancel();
                } catch (_) {}
              }
              previewRenderTasks.clear();
              previewRendered.clear();
              if (previewLoadingTask) {
                previewLoadingTask.destroy().catch(() => {});
                previewLoadingTask = null;
              } else if (previewDocument) {
                previewDocument.destroy().catch(() => {});
              }
              previewDocument = null;
              pdfPageNumbers.value = [];
              pdfPreviewLoading.value = false;
              pdfPreviewError.value = "";
            }
            async function renderPdfPreview() {
              destroyPdfPreview();
              if (!currentPdfBlob.value || !showPdfPreviewModal.value) return;
              const generation = previewGeneration;
              pdfPreviewLoading.value = true;
              pdfPreviewError.value = "";
              try {
                if (typeof pdfjsLib === "undefined")
                  throw new Error("PDF.js 公共库未加载，请检查 vendor 目录。");
                previewWorkerUrl = await LibraryAssets.preparePdfReader();
                if (generation !== previewGeneration) return;
                pdfjsLib.GlobalWorkerOptions.workerSrc = previewWorkerUrl;
                const bytes = new Uint8Array(await currentPdfBlob.value.arrayBuffer());
                if (generation !== previewGeneration) return;
                previewLoadingTask = pdfjsLib.getDocument({
                  data: bytes,
                  isEvalSupported: false,
                  disableAutoFetch: true,
                  useWorkerFetch: false,
                  useSystemFonts: true,
                });
                const doc = await previewLoadingTask.promise;
                if (generation !== previewGeneration) {
                  doc.destroy().catch(() => {});
                  return;
                }
                previewDocument = doc;
                currentPdfPages.value = doc.numPages;
                pdfPageNumbers.value = Array.from({ length: doc.numPages }, (_, i) => i + 1);
                await nextTick();
                pdfPreviewLoading.value = false;
                const pane = pdfPreviewPane.value;
                if (!pane) return;
                const render = (pageNumber) => renderPdfPage(pageNumber, generation);
                if (typeof IntersectionObserver === "function") {
                  previewObserver = new IntersectionObserver(
                    (entries) => {
                      for (const entry of entries)
                        if (entry.isIntersecting) render(Number(entry.target.dataset.page));
                    },
                    { root: pane, rootMargin: "300px 0px" },
                  );
                  pane.querySelectorAll(".pdf-page").forEach((el) => previewObserver.observe(el));
                } else {
                  for (const number of pdfPageNumbers.value) await render(number);
                }
                await render(1);
              } catch (error) {
                if (generation !== previewGeneration) return;
                pdfPreviewLoading.value = false;
                pdfPreviewError.value = `报告已生成，但预览未能加载：${error.message}。请下载 PDF 后打开。`;
              }
            }
            async function renderPdfPage(number, generation) {
              if (
                !previewDocument ||
                previewRendered.has(number) ||
                generation !== previewGeneration
              )
                return;
              const el = pdfPreviewPane.value?.querySelector(`[data-page="${number}"]`);
              if (!el) return;
              previewRendered.add(number);
              let task;
              try {
                const page = await previewDocument.getPage(number);
                if (generation !== previewGeneration) return;
                const base = page.getViewport({ scale: 1 }),
                  target = Math.min(840, Math.max(280, pdfPreviewPane.value.clientWidth - 44)),
                  scale = target / base.width,
                  dpr = Math.min(window.devicePixelRatio || 1, 1.6),
                  viewport = page.getViewport({ scale: scale * dpr }),
                  canvas = el.querySelector("canvas");
                canvas.width = Math.ceil(viewport.width);
                canvas.height = Math.ceil(viewport.height);
                canvas.style.width = `${Math.ceil(viewport.width / dpr)}px`;
                canvas.style.height = `${Math.ceil(viewport.height / dpr)}px`;
                el.style.minHeight = "0";
                task = page.render({
                  canvasContext: canvas.getContext("2d", { alpha: false }),
                  viewport,
                });
                previewRenderTasks.add(task);
                await task.promise;
                if (generation !== previewGeneration) return;
                canvas.classList.remove("hidden");
                el.querySelector(".pdf-page-placeholder")?.classList.add("hidden");
                page.cleanup();
              } catch (error) {
                if (
                  error.name === "RenderingCancelledException" ||
                  generation !== previewGeneration
                )
                  return;
                const placeholder = el.querySelector(".pdf-page-placeholder");
                if (placeholder)
                  placeholder.textContent = `第 ${number} 页预览失败，可下载报告查看。`;
              } finally {
                if (task) previewRenderTasks.delete(task);
              }
            }
            watch(showPdfPreviewModal, async (visible) => {
              if (visible) {
                await nextTick();
                renderPdfPreview();
              } else destroyPdfPreview();
            });

            let mainPdfRenderers = [];
            function disposePdfRenderer(r) {
              if (!r || r.__released) return;
              r.__released = true;
              r.dispose();
              if (r.forceContextLoss) r.forceContextLoss();
            }
            function createStepRenderer(width, height) {
              const canvas = document.createElement("canvas");
              canvas.width = width;
              canvas.height = height;
              let r;
              try {
                r = new THREE.WebGLRenderer({
                  canvas,
                  antialias: true,
                  preserveDrawingBuffer: true,
                  alpha: true,
                });
                r.setSize(width, height, false);
                r.setPixelRatio(1);
                r.outputEncoding = THREE.sRGBEncoding;
                r.toneMapping = THREE.ACESFilmicToneMapping;
                r.toneMappingExposure = 1.05;
              } catch (error) {
                if (r) {
                  r.dispose();
                  if (r.forceContextLoss) r.forceContextLoss();
                }
                const fallback = document.createElement("canvas");
                fallback.width = width;
                fallback.height = height;
                r = { domElement: fallback, isFallback: true, dispose() {}, forceContextLoss() {} };
              }
              mainPdfRenderers.push(r);
              return r;
            }

            /* v5.0：完整装载图集装箱外框绘制开着的尾门（左右两扇门向外摆开 115°，带锁杆线）。 */
            function addPdfOpenDoors(W, H, L) {
              const doors = new THREE.Group();
              const mat = new THREE.LineBasicMaterial({
                color: 0x31566f,
                transparent: true,
                opacity: 0.95,
              });
              for (const side of [-1, 1]) {
                const hinge = new THREE.Group();
                hinge.position.set(side * (W / 2), 0, L / 2);
                const doorW = W / 2;
                const door = new THREE.LineSegments(
                  new THREE.EdgesGeometry(new THREE.PlaneGeometry(doorW, H)),
                  mat,
                );
                door.position.set((-side * doorW) / 2, H / 2, 0);
                hinge.add(door);
                const bars = [];
                for (const t of [0.35, 0.68]) {
                  const x = -side * doorW * t;
                  bars.push(x, 0, 0, x, H, 0);
                }
                const barGeo = new THREE.BufferGeometry();
                barGeo.setAttribute("position", new THREE.Float32BufferAttribute(bars, 3));
                hinge.add(new THREE.LineSegments(barGeo, mat));
                hinge.rotation.y = side * THREE.MathUtils.degToRad(115);
                doors.add(hinge);
              }
              return doors;
            }

            function addPdfFullLoadDimensions(stepScene, W, H, L) {
              const group = new THREE.Group();
              const offset = 350;
              const makeLabel = (text) => {
                const canvas = document.createElement("canvas");
                canvas.width = 512;
                canvas.height = 128;
                const context = canvas.getContext("2d");
                context.fillStyle = "rgba(255,255,255,0.88)";
                context.strokeStyle = "#94a3b8";
                context.lineWidth = 4;
                context.beginPath();
                if (context.roundRect) context.roundRect(40, 20, 432, 88, 44);
                else context.rect(40, 20, 432, 88);
                context.fill();
                context.stroke();
                context.font = "bold 36px ClassicCN, sans-serif";
                context.textAlign = "center";
                context.textBaseline = "middle";
                context.fillStyle = "#0f172a";
                context.fillText(text, 256, 64);
                const material = new THREE.SpriteMaterial({
                  map: new THREE.CanvasTexture(canvas),
                  transparent: true,
                  depthTest: false,
                  depthWrite: false,
                });
                const sprite = new THREE.Sprite(material);
                const scale = Math.max(W, H, L) * 0.022;
                sprite.scale.set(scale * 4, scale, 1);
                sprite.renderOrder = 30;
                return sprite;
              };
              const addDimension = (from, to, text, axis) => {
                const material = new THREE.LineBasicMaterial({
                  color: 0x64748b,
                  depthTest: false,
                  depthWrite: false,
                  transparent: true,
                  opacity: 0.85,
                });
                const line = new THREE.Line(
                  new THREE.BufferGeometry().setFromPoints([from, to]),
                  material,
                );
                line.renderOrder = 29;
                group.add(line);
                let firstStart, firstEnd, secondStart, secondEnd;
                if (axis === "Z") {
                  firstStart = new THREE.Vector3(W / 2, from.y, from.z);
                  firstEnd = new THREE.Vector3(from.x + 60, from.y, from.z);
                  secondStart = new THREE.Vector3(W / 2, to.y, to.z);
                  secondEnd = new THREE.Vector3(to.x + 60, to.y, to.z);
                } else if (axis === "X") {
                  firstStart = new THREE.Vector3(from.x, from.y, L / 2);
                  firstEnd = new THREE.Vector3(from.x, from.y, from.z + 60);
                  secondStart = new THREE.Vector3(to.x, to.y, L / 2);
                  secondEnd = new THREE.Vector3(to.x, to.y, to.z + 60);
                } else {
                  firstStart = new THREE.Vector3(W / 2, from.y, -L / 2);
                  firstEnd = new THREE.Vector3(from.x + 40, from.y, from.z - 40);
                  secondStart = new THREE.Vector3(W / 2, to.y, -L / 2);
                  secondEnd = new THREE.Vector3(to.x + 40, to.y, to.z - 40);
                }
                group.add(
                  new THREE.Line(
                    new THREE.BufferGeometry().setFromPoints([firstStart, firstEnd]),
                    material,
                  ),
                );
                group.add(
                  new THREE.Line(
                    new THREE.BufferGeometry().setFromPoints([secondStart, secondEnd]),
                    material,
                  ),
                );
                const label = makeLabel(text);
                label.position.copy(from).lerp(to, 0.5);
                group.add(label);
              };
              addDimension(
                new THREE.Vector3(W / 2 + offset, 0, -L / 2),
                new THREE.Vector3(W / 2 + offset, 0, L / 2),
                `内长: ${L} mm`,
                "Z",
              );
              addDimension(
                new THREE.Vector3(-W / 2, 0, L / 2 + offset),
                new THREE.Vector3(W / 2, 0, L / 2 + offset),
                `内宽: ${W} mm`,
                "X",
              );
              addDimension(
                new THREE.Vector3(W / 2 + offset, 0, -L / 2 - offset),
                new THREE.Vector3(W / 2 + offset, H, -L / 2 - offset),
                `内高: ${H} mm`,
                "Y",
              );
              stepScene.add(group);
            }

            function fitPdfCameraToContainer(camera, W, H, L, target, includeDimensions) {
              const direction = new THREE.Vector3(1, 0.75, 1.2).normalize();
              const forward = direction.clone().negate();
              const right = new THREE.Vector3()
                .crossVectors(forward, new THREE.Vector3(0, 1, 0))
                .normalize();
              const up = new THREE.Vector3().crossVectors(right, forward).normalize();
              const extra = includeDimensions ? 480 : 0;
              const xValues = [-W / 2, W / 2 + extra];
              const yValues = [-target.y, H - target.y];
              const zValues = [-L / 2 - extra, L / 2 + extra];
              const horizontalTan = Math.tan((camera.fov * Math.PI) / 360) * camera.aspect;
              const verticalTan = Math.tan((camera.fov * Math.PI) / 360);
              const fill = includeDimensions ? 0.94 : 0.96;
              let distance = 1;
              for (const x of xValues)
                for (const y of yValues)
                  for (const z of zValues) {
                    const point = new THREE.Vector3(x, y, z);
                    const depthOffset = point.dot(direction);
                    distance = Math.max(
                      distance,
                      depthOffset + Math.abs(point.dot(right)) / (horizontalTan * fill),
                    );
                    distance = Math.max(
                      distance,
                      depthOffset + Math.abs(point.dot(up)) / (verticalTan * fill),
                    );
                  }
              return { direction, distance };
            }

            // 修改：渲染合并的批次物品 (高亮 itemIndices 的数组集合)
            function renderStepThreeScene(stepRenderer, step) {
              const { result, itemIndices, lastItemIndex, placed, showDimensions = false } = step;
              if (stepRenderer.isFallback) {
                drawPackingDiagram(
                  stepRenderer.domElement.getContext("2d"),
                  stepRenderer.domElement.width,
                  stepRenderer.domElement.height,
                  result,
                  placed.slice(0, lastItemIndex + 1),
                  "iso",
                  new Set(itemIndices),
                  showDimensions,
                  true,
                );
                return;
              }
              const W = result.containerWidth,
                H = result.containerHeight,
                L = result.containerLength;
              const stepScene = new THREE.Scene();

              stepScene.background = new THREE.Color(0xf8fafc);
              stepScene.add(new THREE.AmbientLight(0xffffff, 0.95));
              stepScene.add(new THREE.HemisphereLight(0xffffff, 0xdbe4ee, 0.6));
              const dirLight = new THREE.DirectionalLight(0xffffff, 0.75);
              dirLight.position.set(8000, 14000, 10000);
              stepScene.add(dirLight);
              const fill = new THREE.DirectionalLight(0xffffff, 0.5);
              fill.position.set(-6000, 5000, -8000);
              stepScene.add(fill);

              const container = new THREE.Group();

              const frame = new THREE.LineSegments(
                new THREE.EdgesGeometry(new THREE.BoxGeometry(W, H, L)),
                new THREE.LineBasicMaterial({ color: 0x31566f, transparent: true, opacity: 0.9 }),
              );
              frame.position.y = H / 2;
              container.add(frame);
              if (showDimensions) container.add(addPdfOpenDoors(W, H, L));
              stepScene.add(container);
              addResultPalletVisuals(stepScene, result, lastItemIndex, new Set(itemIndices));
              if (showDimensions) addPdfFullLoadDimensions(stepScene, W, H, L);

              for (let i = 0; i <= lastItemIndex; i += 1) {
                const unit = placed[i];
                const isCurrentBatch = itemIndices.includes(i);

                const baseColor = new THREE.Color(unit.color || "#2563eb");
                const displayColor = isCurrentBatch ? baseColor : new THREE.Color(0xcbd5e1);
                const isPalletSplit =
                  unit.palletized &&
                  (Math.max(1, Number(unit.palletColumns) || 1) > 1 ||
                    Math.max(1, Number(unit.palletLayers) || 1) > 1);

                // 创建容器 group
                const container = new THREE.Group();
                container.position.set(
                  unit.z - W / 2 + unit.dz / 2,
                  unit.y + unit.dy / 2,
                  unit.x - L / 2 + unit.dx / 2,
                );

                if (isPalletSplit) {
                  // 打托货物：渲染为独立子箱体
                  const subGroup = buildPalletSubBoxes(unit, displayColor, isCurrentBatch, false);
                  if (subGroup) container.add(subGroup);
                  // 添加虚线外边界
                  addPalletBoundaryBox(container, unit, isCurrentBatch);
                } else {
                  // 普通货物
                  const geometry = new THREE.BoxGeometry(unit.dz, unit.dy, unit.dx);
                  const material = new THREE.MeshStandardMaterial({
                    color: displayColor,
                    roughness: 0.58,
                    metalness: 0.04,
                    visible: true,
                    transparent: false,
                    opacity: 1.0,
                    emissive: isCurrentBatch
                      ? baseColor.clone().multiplyScalar(0.18)
                      : new THREE.Color(0x000000),
                    polygonOffset: true,
                    polygonOffsetFactor: 1,
                    polygonOffsetUnits: 1,
                  });
                  const mesh = new THREE.Mesh(geometry, material);
                  const edges = new THREE.LineSegments(
                    new THREE.EdgesGeometry(geometry),
                    new THREE.LineBasicMaterial({
                      color: isCurrentBatch ? 0x0f172a : 0x94a3b8,
                      transparent: true,
                      opacity: isCurrentBatch ? 0.8 : 0.35,
                    }),
                  );
                  edges.renderOrder = 1;
                  mesh.add(edges);
                  container.add(mesh);
                }

                if (isCurrentBatch) {
                  let occludedTop = false,
                    occludedFront = false,
                    occludedBack = false,
                    occludedLeft = false,
                    occludedRight = false;
                  for (const b of placed.slice(0, lastItemIndex + 1)) {
                    if (b === unit) continue;
                    if (!occludedTop && Math.abs(b.y - (unit.y + unit.dy)) < 1) {
                      const cx = unit.x + unit.dx / 2;
                      const cz = unit.z + unit.dz / 2;
                      if (cx > b.x && cx < b.x + b.dx && cz > b.z && cz < b.z + b.dz)
                        occludedTop = true;
                    }
                    if (!occludedFront && Math.abs(b.x - (unit.x + unit.dx)) < 1) {
                      const cy = unit.y + unit.dy / 2;
                      const cz = unit.z + unit.dz / 2;
                      if (cy > b.y && cy < b.y + b.dy && cz > b.z && cz < b.z + b.dz)
                        occludedFront = true;
                    }
                    if (!occludedBack && Math.abs(b.x + b.dx - unit.x) < 1) {
                      const cy = unit.y + unit.dy / 2;
                      const cz = unit.z + unit.dz / 2;
                      if (cy > b.y && cy < b.y + b.dy && cz > b.z && cz < b.z + b.dz)
                        occludedBack = true;
                    }
                    if (!occludedRight && Math.abs(b.z - (unit.z + unit.dz)) < 1) {
                      const cx = unit.x + unit.dx / 2;
                      const cy = unit.y + unit.dy / 2;
                      if (cx > b.x && cx < b.x + b.dx && cy > b.y && cy < b.y + b.dy)
                        occludedRight = true;
                    }
                    if (!occludedLeft && Math.abs(b.z + b.dz - unit.z) < 1) {
                      const cx = unit.x + unit.dx / 2;
                      const cy = unit.y + unit.dy / 2;
                      if (cx > b.x && cx < b.x + b.dx && cy > b.y && cy < b.y + b.dy)
                        occludedLeft = true;
                    }
                    if (
                      occludedTop &&
                      occludedFront &&
                      occludedBack &&
                      occludedLeft &&
                      occludedRight
                    )
                      break;
                  }
                  if (
                    !occludedTop ||
                    !occludedFront ||
                    !occludedBack ||
                    !occludedLeft ||
                    !occludedRight
                  ) {
                    const count = unit.pieceCount || 1;
                    const name = unit.cargoName || unit.name.replace(/\s*\[Pallet\]$/, "");
                    let text = `${name}\n(${count}件)`;
                    const isPalletSplit =
                      unit.palletized &&
                      (Math.max(1, Number(unit.palletColumns) || 1) > 1 ||
                        Math.max(1, Number(unit.palletLayers) || 1) > 1);
                    if (isPalletSplit) {
                      text = `${name}\n(打托: 1托, ${count}件)`;
                    }

                    const mat = getLabelMaterial(text);
                    if (!occludedTop) {
                      const w = Math.min(unit.dz * 0.9, unit.dx * 1.8);
                      const h = w * 0.5;
                      const topLabel = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
                      topLabel.rotation.x = -Math.PI / 2;
                      topLabel.position.set(0, unit.dy / 2 + 3.0, 0);
                      container.add(topLabel);
                    }
                    if (!occludedFront) {
                      const w = Math.min(unit.dz * 0.9, unit.dy * 1.8);
                      const h = w * 0.5;
                      const frontLabel = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
                      frontLabel.position.set(0, 0, unit.dx / 2 + 3.0);
                      container.add(frontLabel);
                    }
                    if (!occludedBack) {
                      const w = Math.min(unit.dz * 0.9, unit.dy * 1.8);
                      const h = w * 0.5;
                      const backLabel = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
                      backLabel.rotation.y = Math.PI;
                      backLabel.position.set(0, 0, -unit.dx / 2 - 1.0);
                      container.add(backLabel);
                    }
                    if (!occludedRight) {
                      const w = Math.min(unit.dx * 0.9, unit.dy * 1.8);
                      const h = w * 0.5;
                      const rightLabel = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
                      rightLabel.rotation.y = Math.PI / 2;
                      rightLabel.position.set(unit.dz / 2 + 3.0, 0, 0);
                      container.add(rightLabel);
                    }
                    if (!occludedLeft) {
                      const w = Math.min(unit.dx * 0.9, unit.dy * 1.8);
                      const h = w * 0.5;
                      const leftLabel = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
                      leftLabel.rotation.y = -Math.PI / 2;
                      leftLabel.position.set(-unit.dz / 2 - 1.0, 0, 0);
                      container.add(leftLabel);
                    }
                  }
                }

                stepScene.add(container);
              }

              const aspect = stepRenderer.domElement.width / stepRenderer.domElement.height;
              const perspectiveCamera = new THREE.PerspectiveCamera(
                32,
                aspect,
                20,
                Math.max(W, H, L) * 10,
              );
              const target = new THREE.Vector3(0, H / 2, 0);

              const fittedCamera = fitPdfCameraToContainer(
                perspectiveCamera,
                W,
                H,
                L,
                target,
                showDimensions,
              );
              perspectiveCamera.position
                .copy(target)
                .add(fittedCamera.direction.multiplyScalar(fittedCamera.distance));
              perspectiveCamera.lookAt(target);

              stepRenderer.render(stepScene, perspectiveCamera);

              stepScene.traverse((node) => {
                if (node.geometry) node.geometry.dispose();
                if (node.material) {
                  if (Array.isArray(node.material)) node.material.forEach((m) => m.dispose());
                  else node.material.dispose();
                }
              });
            }

            function formatPdfStatusNumber(value, decimals = 0) {
              const number = Number(value) || 0;
              return decimals
                ? number.toFixed(decimals)
                : Math.round(number).toLocaleString("zh-CN");
            }

            function drawPdfCompactContainerStatus(pdf, result, imageX, imageY, imageWidth) {
              const rows = [
                `体积 ${formatPdfStatusNumber(result.volumeRate, 1)}%`,
                `重量 ${formatPdfStatusNumber(result.weightRate, 1)}%`,
                `已装 ${formatPdfStatusNumber(result.placedCount)} 件`,
                `余深 ${formatPdfStatusNumber(result.tailSpace)} mm`,
              ];
              const right = imageX + imageWidth - 4;
              pdf.setFontSize(7.5);
              pdf.setTextColor(51, 65, 85);
              rows.forEach((text, index) =>
                pdf.text(text, right, imageY + 6 + index * 4, { align: "right" }),
              );
            }

            function drawPdfCargoColorLegend(pdf, result, imageX, imageY, imageHeight) {
              const seen = new Map();
              (result.placed || []).forEach((item) => {
                const name = item.cargoName || item.name.replace(/\s*\[Pallet\]$/, "");
                if (!seen.has(name)) seen.set(name, item.color || "#2563eb");
              });
              if (seen.size === 0) return;
              const blockW = 5,
                blockH = 3,
                lineHeight = 5;
              const maxItems = Math.floor((imageHeight - 8) / lineHeight);
              const entries = [...seen.entries()].slice(0, maxItems);
              const left = imageX + 3;
              let y = imageY + imageHeight - entries.length * lineHeight - 3;
              pdf.setFontSize(6);
              entries.forEach(([name, color]) => {
                pdf.setFillColor(color);
                pdf.rect(left, y - blockH + 0.8, blockW, blockH, "F");
                pdf.setDrawColor(180, 180, 180);
                pdf.setLineWidth(0.15);
                pdf.rect(left, y - blockH + 0.8, blockW, blockH, "S");
                pdf.setTextColor(30, 41, 59);
                let label = name;
                const maxLabelW = 35;
                while (label.length > 1 && pdf.getTextWidth(label) > maxLabelW)
                  label = label.slice(0, -1);
                if (label.length < name.length) label += "...";
                pdf.text(label, left + blockW + 1.5, y);
                y += lineHeight;
              });
            }

            function buildPdfStepCaption(
              pdf,
              maxWidth,
              stepNumber,
              cargoName,
              totalPieceCount,
              palletized,
              palletUnits,
              pieceCountPerUnit,
            ) {
              const prefix = `[步骤 ${stepNumber}] `;
              const countSuffix = ` x ${totalPieceCount} 件`;
              let palletDetail = palletized
                ? ` (打托: ${palletUnits}托, 每托${pieceCountPerUnit}件)`
                : "";
              if (pdf.getTextWidth(prefix + countSuffix + palletDetail) > maxWidth)
                palletDetail = "";
              const fullName = String(cargoName || "未命名货物");
              let visibleName = fullName;
              while (
                visibleName.length &&
                pdf.getTextWidth(
                  prefix +
                    visibleName +
                    (visibleName.length < fullName.length ? "..." : "") +
                    countSuffix +
                    palletDetail,
                ) > maxWidth
              ) {
                visibleName = visibleName.slice(0, -1);
              }
              if (visibleName.length < fullName.length && visibleName.length) visibleName += "...";
              return `${prefix}${visibleName}${countSuffix}${palletDetail}`;
            }

            function addPdfPageNumbers(pdf) {
              const totalPages = pdf.getNumberOfPages();
              for (let page = 1; page <= totalPages; page += 1) {
                pdf.setPage(page);
                if (pdf.existsFileInVFS("SourceHanSans.ttf")) pdf.setFont("SourceHanSans");
                else pdf.setFont("helvetica");
                pdf.setFontSize(8);
                pdf.setTextColor(100, 116, 139);
                pdf.text(
                  `第 ${page} / ${totalPages} 页`,
                  pdf.internal.pageSize.getWidth() / 2,
                  pdf.internal.pageSize.getHeight() - 7,
                  { align: "center" },
                );
              }
            }

            // 修改：使用原生的 jsPDF 方法代替 Canvas 截图

            async function exportLoadingStepsPDFOnMainThread() {
              if (!hasCalculated.value || resultsStale.value) return;
              if (!window.jspdf || !window.jspdf.jsPDF) {
                notify("内嵌 PDF 组件加载失败。", "error");
                return;
              }

              loadingMessage.value = "正在生成装箱报告 PDF...（正在准备装载步骤）";
              const token = startJob("pdf", "正在兼容模式下生成中文装箱报告…");
              mainPdfRenderers = [];

              await new Promise((r) => setTimeout(r, 20));

              try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                  orientation: "portrait",
                  unit: "mm",
                  format: "a4",
                  compress: true,
                });

                await Embedded.fontReady;
                assertJob(token);
                await initJsPdfChineseFont(pdf);

                // ==========================================
                // 1. 第一部分：按货柜分组的物资清单表格
                // ==========================================
                pdf.setTextColor(15, 23, 42);
                pdf.setFontSize(18);
                pdf.text("装箱物资分配清单", 14, 20);

                writeReportSubtitle(
                  pdf,
                  planName.value,
                  resultSummary.value.placed,
                  resultSummary.value.unplaced,
                );
                let currentY = 35;

                results.value.forEach((result, cIndex) => {
                  assertJob(token);
                  // 【修复核心 1】：提取真实的货物名称，并累加实际的原货物数量 (pieceCount)
                  const placedCountMap = Object.create(null);
                  (result.placed || []).forEach((p) => {
                    const actualName = p.cargoName || p.name.replace(/\s*\[Pallet\]$/, "");
                    const count = p.pieceCount || 1;
                    placedCountMap[actualName] = (placedCountMap[actualName] || 0) + count;
                  });

                  // 构建该柜的表格数据
                  const tableData = [];
                  resultInputItems.value.forEach((item) => {
                    const placedCount = placedCountMap[item.name] || 0;
                    if (placedCount > 0) {
                      tableData.push([
                        item.name,
                        item.l,
                        item.w,
                        item.h,
                        `${placedCount} / ${item.qty}`, // 格式: 本柜数量 / 总数量
                        item.color,
                      ]);
                    }
                  });

                  // 如果该柜没有任何匹配的货物，跳过表格渲染
                  if (tableData.length === 0) return;

                  // 检查是否需要换页
                  if (currentY > 250) {
                    pdf.addPage("a4", "portrait");
                    currentY = 20;
                  }

                  // 绘制货柜标题
                  pdf.setFontSize(13);
                  pdf.setTextColor(37, 99, 235); // Blue-600
                  const cL = result.containerLength,
                    cW = result.containerWidth,
                    cH = result.containerHeight;
                  pdf.text(
                    `货柜 #${cIndex + 1} : ${result.containerName} (内尺寸 ${cL} x ${cW} x ${cH} mm)`,
                    14,
                    currentY,
                  );
                  currentY += 4;

                  // 使用 autoTable 渲染表格
                  pdf.autoTable({
                    startY: currentY,
                    margin: { top: 20, left: 14, right: 14, bottom: 34 },
                    head: [["货物名称", "长 (mm)", "宽 (mm)", "高 (mm)", "本柜 / 总计", "颜色"]],
                    body: tableData,
                    styles: {
                      font: "SourceHanSans",
                      fontStyle: "normal",
                      fontSize: 10,
                      valign: "middle",
                      halign: "center",
                    },
                    headStyles: {
                      fontStyle: "normal",
                      fillColor: [241, 245, 249],
                      textColor: [15, 23, 42],
                      lineWidth: 0.1,
                      lineColor: [203, 213, 225],
                    },
                    bodyStyles: { lineWidth: 0.1, lineColor: [226, 232, 240] },
                    columnStyles: { 0: { halign: "left" } },
                    willDrawCell: function (data) {
                      if (data.section === "body" && data.column.index === 5) {
                        data.cell.text = "";
                      }
                    },
                    didDrawCell: function (data) {
                      if (data.section === "body" && data.column.index === 5) {
                        const colorHex = tableData[data.row.index][5];
                        if (colorHex) {
                          pdf.setFillColor(colorHex);
                          const rectW = 10;
                          const rectH = 5;
                          const rectX = data.cell.x + (data.cell.width - rectW) / 2;
                          const rectY = data.cell.y + (data.cell.height - rectH) / 2;
                          pdf.rect(rectX, rectY, rectW, rectH, "F");
                        }
                      }
                    },
                  });

                  currentY = pdf.lastAutoTable.finalY + 8;
                });

                // ==========================================
                // 2. 第二部分：满载完整装载图 (Landscape)
                // ==========================================
                appendReportNotes(pdf, currentY, globalUnplacedAgg.value);
                appendPalletReport(pdf, results.value);
                assertJob(token);
                const fullRenderer = createStepRenderer(2400, 1365);

                results.value.forEach((result, cIndex) => {
                  assertJob(token);
                  pdf.addPage("a4", "landscape");
                  pdf.setFontSize(16);
                  pdf.setTextColor(15, 23, 42);

                  // 加上集装箱内尺寸信息
                  const cL = result.containerLength,
                    cW = result.containerWidth,
                    cH = result.containerHeight;
                  pdf.text(
                    `完整装载图 - ${result.containerName} #${cIndex + 1} (内尺寸: ${cL} x ${cW} x ${cH} mm)`,
                    14,
                    18,
                  );

                  const allIndices = result.placed.map((_, idx) => idx);
                  const fullStep = {
                    result,
                    itemIndices: allIndices,
                    lastItemIndex: result.placed.length - 1,
                    placed: result.placed,
                    showDimensions: true,
                  };

                  renderStepThreeScene(fullRenderer, fullStep);
                  const fullImg = fullRenderer.domElement.toDataURL("image/jpeg", 0.86);
                  pdf.addImage(fullImg, "JPEG", 14, 24, 269, 170);
                  drawPdfCompactContainerStatus(pdf, result, 14, 24, 269);
                  drawPdfCargoColorLegend(pdf, result, 14, 24, 170);
                });

                disposePdfRenderer(fullRenderer);

                // ==========================================
                // 3. 第三部分：每页 6 个的智能步骤图 (Portrait)
                // ==========================================
                const steps = [];
                results.value.forEach((result, containerIndex) => {
                  const placed = result.placed || [];
                  let currentBatch = [];

                  for (let i = 0; i < placed.length; i++) {
                    const p = placed[i];
                    if (currentBatch.length === 0) {
                      currentBatch.push(i);
                    } else {
                      const prev = placed[currentBatch[currentBatch.length - 1]];
                      if (
                        prev.name === p.name &&
                        Math.abs(prev.dx - p.dx) < 1 &&
                        Math.abs(prev.dy - p.dy) < 1 &&
                        Math.abs(prev.dz - p.dz) < 1
                      ) {
                        currentBatch.push(i);
                      } else {
                        steps.push({
                          result,
                          containerIndex,
                          itemIndices: currentBatch,
                          lastItemIndex: currentBatch[currentBatch.length - 1],
                          placed,
                        });
                        currentBatch = [i];
                      }
                    }
                  }
                  if (currentBatch.length > 0) {
                    steps.push({
                      result,
                      containerIndex,
                      itemIndices: currentBatch,
                      lastItemIndex: currentBatch[currentBatch.length - 1],
                      placed,
                    });
                  }
                });

                if (steps.length > 0) {
                  loadingMessage.value = `正在生成装箱报告 PDF...（装载步骤 0 / ${steps.length}，正在渲染步骤图）`;
                  const stepRenderer = createStepRenderer(1500, 1125);
                  const pageWidth = 210,
                    pageHeight = 297;
                  const margin = 14,
                    headerHeight = 14,
                    gap = 8;
                  const cardWidth = (pageWidth - margin * 2 - gap) / 2;
                  const cardHeight = (pageHeight - headerHeight - margin - gap * 2) / 3;

                  let stepCounter = 1;
                  for (let i = 0; i < steps.length; i++) {
                    assertJob(token);
                    const indexOnPage = i % 6;

                    if (indexOnPage === 0) pdf.addPage("a4", "portrait");

                    const col = indexOnPage % 2;
                    const row = Math.floor(indexOnPage / 2);
                    const left = margin + col * (cardWidth + gap);
                    const top = headerHeight + row * (cardHeight + gap);

                    const step = steps[i];
                    const firstP = step.placed[step.itemIndices[0]];
                    const isContainerStart =
                      i === 0 || steps[i - 1].containerIndex !== step.containerIndex;
                    const containerLabelHeight = isContainerStart ? 7 : 0;
                    const imageTop = top + containerLabelHeight;

                    const imgHeight = cardHeight - 12 - containerLabelHeight;
                    renderStepThreeScene(stepRenderer, step);
                    const imgData = stepRenderer.domElement.toDataURL("image/jpeg", 0.86);
                    if (isContainerStart) {
                      let containerLabel = `货柜 #${step.containerIndex + 1}: ${step.result.containerName}`;
                      pdf.setFontSize(8);
                      pdf.setTextColor(37, 99, 235);
                      while (
                        containerLabel.length > 1 &&
                        pdf.getTextWidth(containerLabel) > cardWidth - 2
                      )
                        containerLabel = `${containerLabel.slice(0, -4)}...`;
                      pdf.text(containerLabel, left, top + 4.5);
                    }
                    pdf.addImage(imgData, "JPEG", left, imageTop, cardWidth, imgHeight);

                    pdf.setDrawColor(226, 232, 240);
                    pdf.setLineWidth(0.3);
                    pdf.rect(left, imageTop, cardWidth, imgHeight);

                    pdf.setFontSize(9);
                    pdf.setTextColor(15, 23, 42);

                    const isPallet =
                      firstP.palletized &&
                      (Math.max(1, Number(firstP.palletColumns) || 1) > 1 ||
                        Math.max(1, Number(firstP.palletLayers) || 1) > 1);
                    const pCount = firstP.pieceCount || 1;
                    const totalCount = pCount * step.itemIndices.length;
                    const baseName = firstP.cargoName || firstP.name.replace(/\s*\[Pallet\]$/, "");

                    const textStr =
                      mixedPalletCaption(pdf, cardWidth - 4, stepCounter, step) ||
                      buildPdfStepCaption(
                        pdf,
                        cardWidth - 4,
                        stepCounter++,
                        baseName,
                        totalCount,
                        isPallet,
                        step.itemIndices.length,
                        pCount,
                      );

                    if (firstP.groupInstance) stepCounter++;
                    const textW = pdf.getTextWidth(textStr);
                    const textX = left + (cardWidth - textW) / 2;
                    pdf.text(textStr, textX, imageTop + imgHeight + 7);

                    loadingMessage.value = `正在生成装箱报告 PDF...（装载步骤 ${i + 1} / ${steps.length}，正在渲染步骤图）`;
                    if ((i + 1) % 3 === 0 || i + 1 === steps.length) {
                      await new Promise((resolve) => requestAnimationFrame(resolve));
                    }
                  }

                  disposePdfRenderer(stepRenderer);
                }

                assertJob(token);
                addPdfPageNumbers(pdf);
                currentPdfPages.value = pdf.getNumberOfPages();
                const pdfBlob = pdf.output("blob");
                currentPdfBlob.value = pdfBlob;
                pdfPreviewUrl.value = URL.createObjectURL(pdfBlob);
                showPdfPreviewModal.value = true;
                notify("中文装箱报告已生成（兼容模式）。");
              } catch (err) {
                if (err.name !== "AbortError")
                  requestMessage(
                    "生成报告失败",
                    err.message,
                    [{ label: "确定", value: true, primary: true }],
                    "error",
                  );
              } finally {
                mainPdfRenderers.forEach(disposePdfRenderer);
                mainPdfRenderers = [];
                finishJob(token);
              }
            }

            onMounted(initializeApp);
            return {
              palletGroups,
              usePalletGroups,
              showPalletEditor,
              palletEditorFrame,
              palletInfo,
              palletCustomCopies,
              palletReservations,
              palletErrors,
              palletSummaryTotals,
              openPalletEditor,
              closePalletEditor,
              sendPalletEditorData,
              duplicatePalletGroup,
              openPalletReuse,
              commitPalletReuse,
              palletReuseInfo,
              removePalletGroup,
              skipPalletStage,
              getThumb,
              migrateLegacyPallets,
              step,
              activePlanId,
              savedPlans,
              planName,
              dirty,
              savedFingerprint,
              presets,
              allContainers,
              selectedContainers,
              focusedContainer,
              containerDiagram,
              focusedContainerKey,
              selectedPresets,
              customContainers,
              containerPriority,
              loadingStrategy,
              loadingPreference,
              items,
              selectedItem,
              selectedItemId,
              itemSearch,
              planSearch,
              filteredItems,
              filteredPlans,
              activeSavedPlan,
              isAllEnabled,
              validItems,
              totalPieces,
              totalVolume,
              totalWeight,
              storageAvailable,
              draftState,
              statusMessage,
              toastState,
              wideViewport,
              sidebarOpen,
              propertiesCollapsed,
              propertiesHeight,
              openMenu,
              contextMenu,
              dialog,
              renameText,
              helpTab,
              batchOptions,
              importPreview,
              excelFileInput,
              projectFileInput,
              cargoGrid,
              calculating,
              jobKind,
              loadingMessage,
              jobElapsed,
              results,
              globalUnplacedAgg,
              activeResultIndex,
              resultDetailTab,
              resultFingerprint,
              resultInputItems,
              hasCalculated,
              activeRes,
              showPdfPreviewModal,
              pdfPreviewUrl,
              currentPdfBlob,
              currentPdfPages,
              pdfPreviewPane,
              pdfPageNumbers,
              pdfPreviewLoading,
              pdfPreviewError,
              previewFallback,
              fullResultView,
              previewState,
              previewCargoCount,
              refreshResultPreview,
              resultsStale,
              resultsReady,
              resultSummary,
              activeAllocation,
              itemErrors,
              validationErrors,
              fitWarnings,
              itemFieldLabels,
              containerFieldLabels,
              orientationOptions,
              viewOptions,
              fmt,
              formatDate,
              itemVolume,
              containerVolume,
              validContainerField,
              normalizePlanName,
              togglePreset,
              addCustomContainer,
              removeCustomContainer,
              addItem,
              selectItem,
              onEnabledChange,
              checkAutoEnable,
              duplicateItem,
              removeSelectedItem,
              focusNextRow,
              palletMaxLayers,
              clampPalletLayers,
              palletSummary,
              cargoFitStatus,
              hasFieldError,
              itemStatus,
              showValidation,
              locateError,
              saveCurrentPlan,
              createNewPlan,
              loadPlan,
              duplicatePlan,
              deletePlan,
              renamePlan,
              submitRename,
              loadExample,
              notify,
              closeDialog,
              closeMenus,
              toggleMenu,
              invokeMenu,
              closeContextIfOutside,
              openPlanContext,
              openHelp,
              openBatch,
              applyBatch,
              goStep,
              recalc,
              startPropertyResize,
              exportProject,
              triggerProjectImport,
              handleProjectImport,
              triggerExcelImport,
              exportItemsExcel,
              handleExcelImport,
              commitExcelImport,
              menus,
              undoEdit,
              redoEdit,
              history,
              historyIndex,
              pdfExportFileName,
              downloadPdf,
              closePdfPreview,
              runCalc,
              cancelJob,
              generateStepsPreview,
              unplacedReason,
              viewMode,
              setView,
              canvasWrap,
              hoverTooltip,
              loadingStepIndex,
              activeLoadingSteps,
              loadingStepList,
              allLoadingStepGroups,
              showLoadingStep,
              resetLoadingPreview,
              showLoadingStepForContainer,
              highlightLoadingStep,
              highlightLoadingStepForContainer,
              clearLoadingStepHighlight,
              globalUnplacedList,
              switchResult,
              scrollResultTabs,
              resultTabsEl,
            };
          },
          template: "#app-template",
        });
        classicApp.mount("#app");
      }
