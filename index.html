          new THREE.EdgesGeometry(geometry),
          new THREE.LineBasicMaterial({
            color: 0x765737,
            transparent: true,
            opacity: highlighted ? 0.38 : 0.24,
          }),
        );
        edges.name = "pallet-board-edges";
        group.add(edges);
        if (swapAxes) {
          group.rotation.y = Math.PI / 2;
          group.scale.x = -1;
        }
        return group;
      }

    <script id="shared-diagram">
      /* Canvas compatibility renderer. It uses the same real placements as WebGL. */
      function drawPackingDiagram(
        ctx,
        width,
        height,
        result,
        placed,
        mode = "iso",
        currentIndices = null,
        showDimensions = false,
        grayPrevious = false,
      ) {
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "#f8faf7";
        ctx.fillRect(0, 0, width, height);
        if (!result) return [];
        const L = Number(result.containerLength),
          W = Number(result.containerWidth),
          H = Number(result.containerHeight);
        if (![L, W, H].every((v) => v > 0)) return [];
        const project = (x, y, z) =>
          mode === "front"
            ? [z, -y]
            : mode === "side"
              ? [x, -y]

                ? [x, z]
                : [(x - z) * 0.82, (x + z) * 0.29 - y];
        const corners = [
          [0, 0, 0],
          [L, 0, 0],
          [L, 0, W],
          [0, 0, W],
          [0, H, 0],
          [L, H, 0],
          [L, H, W],
          [0, H, W],
        ];
        /* v5.0：完整装载图外框绘制开着的尾门（仅报告 iso 全景，两级投影外沿纳入取景）。 */
        const doorPoints =
          showDimensions && mode === "iso"
            ? [
                [(-Math.sqrt(3) * W) / 4, 0, -W / 4],
                [(-Math.sqrt(3) * W) / 4, H, -W / 4],
                [(-Math.sqrt(3) * W) / 4, 0, W * 1.25],

          ys = raw.map((p) => p[1]),

          maxX = Math.max(...xs),
          minY = Math.min(...ys),
          maxY = Math.max(...ys);
        const margin = Math.min(width, height) * 0.075,
          extra = showDimensions ? 26 : 10,

            (width - margin * 2) / (maxX - minX || 1),
            (height - margin * 2 - extra) / (maxY - minY || 1),

          oy = (height - extra - (maxY - minY) * scale) / 2 - minY * scale;

          const v = project(x, y, z);

          ctx.closePath();

          const n = parseInt(str.slice(1), 16),
            adjust = (c) => Math.max(0, Math.min(255, Math.round(c + amount)));

        };

        ctx.strokeStyle = "#a3b7bf";
        ctx.lineWidth = 1;
        ctx.setLineDash([5, 4]);
        for (const [a, b] of [
          [0, 1],
          [1, 2],
          [2, 3],
          [3, 0],
          [4, 5],
          [5, 6],
          [6, 7],
          [7, 4],
          [0, 4],
          [1, 5],
          [2, 6],
          [3, 7],
        ]) {
          ctx.beginPath();
          ctx.moveTo(...frame[a]);
          ctx.lineTo(...frame[b]);
          ctx.stroke();
        }
        ctx.setLineDash([]);
        if (doorPoints.length) {
          for (const [z, free] of [
            [0, [(-Math.sqrt(3) * W) / 4, -W / 4]],
            [W, [(-Math.sqrt(3) * W) / 4, W * 1.25]],

            const [fx, fz] = free,

                quad[0][0] + (quad[1][0] - quad[0][0]) * t,

          .filter((b) => b.editorPreview || b.firstItemIndex < (placed || []).length)

              ctx.textBaseline = "middle";

    <script id="shared-pallet-render">
      /* Shared atomic loading steps and physical pallet visuals; reused by both PDF paths. */

            batch = [];

        for (let i = 0; i < placed.length; i++) {
          const p = placed[i],
            previous = placed[batch[batch.length - 1]];

            previous &&
            (p.groupInstance || previous.groupInstance
              ? p.groupInstance && p.groupInstance === previous.groupInstance
              : previous.name === p.name &&
                Math.abs(previous.dx - p.dx) < 1 &&
                Math.abs(previous.dy - p.dy) < 1 &&
                Math.abs(previous.dz - p.dz) < 1);

          batch.push(i);
        }
        flush();
        return steps;

            function onKeyDown(event) {
              const key = event.key.toLowerCase(),
                ctrl = event.ctrlKey || event.metaKey,
                isInput = /^(input|textarea|select)$/i.test(event.target?.tagName || "");
              if (showPalletEditor.value) {
                if (key === "escape") closePalletEditor();
                if (key === "escape" || key === "f5" || (ctrl && ["s", "n", "o"].includes(key)))
                  event.preventDefault();
                return;
              }
              if (
                key === "tab" &&
                (dialog.value || showPdfPreviewModal.value || calculating.value)
              ) {
                const windows = [...document.querySelectorAll(".modal-backdrop .dialog-window")],
                  win = windows[windows.length - 1],
                  focusables = win
                    ? [...win.querySelectorAll("button,input,select,textarea,a[href]")].filter(
                        (e) => !e.disabled && e.offsetParent !== null,
                      )
                    : [];
                if (focusables.length) {
                  const first = focusables[0],
                    last = focusables[focusables.length - 1];
                  if (
                    event.shiftKey &&
                    (document.activeElement === first || !win.contains(document.activeElement))
                  ) {
                    event.preventDefault();
                    last.focus();
                  } else if (
                    !event.shiftKey &&
                    (document.activeElement === last || !win.contains(document.activeElement))
                  ) {
                    event.preventDefault();
                    first.focus();
                  }
                }
                return;
              }
              if (
                !calculating.value &&
                !dialog.value &&
                !showPdfPreviewModal.value &&
                event.altKey &&
                ["f", "e", "c", "v", "h"].includes(key)
              ) {
                event.preventDefault();
                const map = { f: "file", e: "edit", c: "calc", v: "view", h: "help" };
                toggleMenu(map[key]);
                nextTick(() => document.querySelector(".dropdown button:not(:disabled)")?.focus());
                return;
              }
              if (
                openMenu.value &&
                ["arrowdown", "arrowup", "arrowleft", "arrowright", "home", "end"].includes(key)
              ) {
                event.preventDefault();
                if (key === "arrowleft" || key === "arrowright") {
                  const keys = menus.value.map((m) => m.key),
                    index = keys.indexOf(openMenu.value);
                  openMenu.value =
                    keys[(index + (key === "arrowright" ? 1 : keys.length - 1)) % keys.length];
                  nextTick(() =>
                    document.querySelector(".dropdown button:not(:disabled)")?.focus(),
                  );
                } else {
                  const buttons = [...document.querySelectorAll(".dropdown button:not(:disabled)")],
                    index = buttons.indexOf(document.activeElement);
                  if (buttons.length) {
                    const target =
                      key === "home"
                        ? 0
                        : key === "end"
                          ? buttons.length - 1
                          : key === "arrowdown"
                            ? (index + 1) % buttons.length
                            : (index - 1 + buttons.length) % buttons.length;
                    buttons[target].focus();
                  }
                }
                return;
              }
              if (key === "escape") {
                closeMenus();
                if (dialog.value) {
                  closeDialog(null);
                  event.preventDefault();
                } else if (showPdfPreviewModal.value) {
                  closePdfPreview();
                  event.preventDefault();
                } else if (showPalletEditor.value) {
                  closePalletEditor();
                  event.preventDefault();
                }
                return;
              }
              if (calculating.value) {
                if (key === "f5") event.preventDefault();
                return;
              }
              if (dialog.value || showPdfPreviewModal.value) return;
              if (key === "f5") {

                return;

                return;

                event.preventDefault();
                goStep(Number(key));
              }

            function cargoFromHit(object) {
              let current = object;
              while (current) {
                if (current.userData && current.userData.pickableCargo)
                  return current.userData.pickableCargo;
                current = current.parent;
              }
              return null;

            function formatHoverTooltip(cargo) {
              const name =
                cargo.cargoName || String(cargo.name || "").replace(/\s*\[Pallet\]$/, "");
              const count = Math.max(1, Number(cargo.pieceCount) || 1);
              const palletized = cargo.palletized && count > 1;
              const type = palletized
                ? `打托货物：1 托，${count} 件（${Math.max(1, Number(cargo.palletColumns) || 1)} 列 x ${Math.max(1, Number(cargo.palletLayers) || 1)} 层）`
                : `货物数量：${count} 件`;
              const weight = Number(cargo.weight);
              const lines = [type, `外廓：${cargo.dx} x ${cargo.dz} x ${cargo.dy} mm`];
              if (Number.isFinite(weight))
                lines.push(
                  `重量：${weight.toLocaleString("zh-CN", { maximumFractionDigits: 2 })} kg`,
                );
              const u = palletUnitFor(activeRes.value, cargo);
              if (u)
                lines.push(
                  "所在整托：" +
                    u.name +
                    " · " +
                    Object.values(u.contents).reduce((a, b) => a + b, 0) +
                    " 件 · 含盘 " +
                    u.weight +
                    " kg",
                );
              return { name, lines };
            }

            function updateHoverOutline(cargo) {
              if (!hoverOutline || !activeRes.value) return;
              const W = activeRes.value.containerWidth,
                L = activeRes.value.containerLength;
              const u = palletUnitFor(activeRes.value, cargo);
              if (u)
                cargo = {
                  ...cargo,
                  x: u.x,
                  y: u.y,
                  z: u.z,
                  dx: u.length,
                  dy: u.height,
                  dz: u.width,
                };
              hoverOutline.box.min.set(cargo.z - W / 2, cargo.y, cargo.x - L / 2);
              hoverOutline.box.max.set(
                cargo.z - W / 2 + cargo.dz,
                cargo.y + cargo.dy,
                cargo.x - L / 2 + cargo.dx,
              );
              hoverOutline.visible = true;
            }

            function highlightCargo(cargo) {
              if (hoveredCargo !== cargo) {
                clearHoveredCargo();
                hoveredCargo = cargo;
                boxesGroup.traverse((object) => {
                  if (
                    !sameResultCargo(cargoFromHit(object), cargo) ||
                    !object.isMesh ||
                    !object.material ||
                    !object.material.emissive
                  )
                    return;
                  const material = object.material;
                  material.userData.hoverEmissive = material.emissive.clone();
                  material.userData.hoverEmissiveIntensity = material.emissiveIntensity;
                  material.emissive.set(0x0369a1);
                  material.emissiveIntensity = 0.42;
                });
                updateHoverOutline(cargo);
              }

            function dimOtherCargo(targetCargo) {
              if (!boxesGroup) return;
              restoreDimmedCargo();
              // Full-load overview must never become an almost-empty ghost container on hover.
              if (fullResultView.value) return;
              boxesGroup.traverse((object) => {
                if (sameResultCargo(cargoFromHit(object), targetCargo)) return;
                const material = object.material;
                if (object.isMesh && material && material.isMeshStandardMaterial) {
                  material.userData.loadingDimState = {
                    color: material.color.clone(),
                    emissive: material.emissive.clone(),
                    emissiveIntensity: material.emissiveIntensity,
                    transparent: material.transparent,
                    opacity: material.opacity,
                    depthWrite: material.depthWrite,
                  };
                  material.color.set(0xcbd5e1);
                  material.emissive.set(0x000000);
                  material.emissiveIntensity = 0;
                  material.transparent = true;
                  material.opacity = 0.3;
                  material.depthWrite = false;
                } else if (object.isLine && material) {
                  material.userData.loadingDimState = {
                    color: material.color ? material.color.clone() : null,
                    transparent: material.transparent,
                    opacity: material.opacity,
                    depthWrite: material.depthWrite,
                  };
                  if (material.color) material.color.set(0x94a3b8);
                  material.transparent = true;
                  material.opacity = 0.3;
                  material.depthWrite = false;
                } else if (
                  object.isMesh &&
                  material &&
                  material.isMeshBasicMaterial &&
                  material.map
                ) {
                  object.userData.loadingDimVisible = object.visible;
                  object.visible = false;
                }
              });
              hasDimmedCargo = true;

            function restoreDimmedCargo() {
              if (!hasDimmedCargo || !boxesGroup) return;
              boxesGroup.traverse((object) => {
                const material = object.material;
                const state =
                  material && material.userData ? material.userData.loadingDimState : null;
                if (state) {
                  if (state.color && material.color) material.color.copy(state.color);
                  if (state.emissive && material.emissive) material.emissive.copy(state.emissive);
                  if (state.emissiveIntensity !== undefined)
                    material.emissiveIntensity = state.emissiveIntensity;
                  material.transparent = state.transparent;
                  material.opacity = state.opacity;
                  material.depthWrite = state.depthWrite;
                  delete material.userData.loadingDimState;
                }
                if (object.userData.loadingDimVisible !== undefined) {
                  object.visible = object.userData.loadingDimVisible;
                  delete object.userData.loadingDimVisible;
                }
              });
              hasDimmedCargo = false;

              tooltip.classList.remove("hidden");

            function showCargoTooltipAtPosition(cargo) {
              if (!camera || !canvasWrap.value || !activeRes.value) return;

                cargo.z - W / 2 + cargo.dz / 2,

                cargo.x - L / 2 + cargo.dx / 2,

                cargo,

            function clearHoveredCargo() {
              if (hoveredCargo) {
                boxesGroup &&
                  boxesGroup.traverse((object) => {
                    if (
                      cargoFromHit(object) !== hoveredCargo ||
                      !object.isMesh ||
                      !object.material ||
                      !object.material.emissive
                    )
                      return;
                    const material = object.material;
                    if (material.userData.hoverEmissive)
                      material.emissive.copy(material.userData.hoverEmissive);
                    if (material.userData.hoverEmissiveIntensity !== undefined)
                      material.emissiveIntensity = material.userData.hoverEmissiveIntensity;
                    delete material.userData.hoverEmissive;
                    delete material.userData.hoverEmissiveIntensity;

            function onCanvasPointerMove(event) {
              if (!cargoRaycaster || !renderer || !camera || !boxesGroup) return;
              const rect = renderer.domElement.getBoundingClientRect();
              pointerNdc.set(
                ((event.clientX - rect.left) / rect.width) * 2 - 1,

            function highlightLoadingStep(stepIndex) {
              const steps = activeLoadingSteps.value;
              const targetStep = steps[stepIndex];

                activeRes.value && targetStep
                  ? activeRes.value.placed[targetStep.itemIndices[0]]
                  : null;

              listHoverStepIndex = stepIndex;
              const selectedStep = steps[loadingStepIndex.value];
              const selectedLastItem = selectedStep ? selectedStep.lastItemIndex : -1;
              // Later items are not part of the current preview yet. Temporarily
              // render through the hovered step so its exact location can be highlighted.
              if (targetStep.lastItemIndex > selectedLastItem) {
                drawBoxes(
                  activeRes.value.placed.slice(0, targetStep.lastItemIndex + 1),
                  new Set(targetStep.itemIndices),

            function highlightLoadingStepForContainer(containerIndex, stepIndex) {
              if (containerIndex !== activeResultIndex.value) {
                if (!listHoverRestore) {
                  listHoverRestore = {
                    containerIndex: activeResultIndex.value,
                    stepIndex: loadingStepIndex.value,

                switchResult(containerIndex);
              }
              highlightLoadingStep(stepIndex);
            }

            function showLoadingStepForContainer(containerIndex, stepIndex) {
              // A click commits the selected container instead of restoring the
              // view that was temporarily opened for a list hover.
              listHoverRestore = null;
              listHoverStepIndex = null;
              if (containerIndex !== activeResultIndex.value) switchResult(containerIndex);
              showLoadingStep(stepIndex);
            }

            function clearLoadingStepHighlight() {
              restoreDimmedCargo();
              if (listHoverRestore) {
                const restore = listHoverRestore;
                listHoverRestore = null;
                listHoverStepIndex = null;
                if (restore.containerIndex !== activeResultIndex.value)
                  switchResult(restore.containerIndex);
                if (restore.full) resetLoadingPreview();
                else showLoadingStep(restore.stepIndex);
                return;
              }
              const hoveredStep = listHoverStepIndex;
              listHoverStepIndex = null;
              const selectedStep = activeLoadingSteps.value[loadingStepIndex.value];
              if (hoveredStep !== null && selectedStep && hoveredStep > loadingStepIndex.value) {
                showLoadingStep(loadingStepIndex.value);
              } else {
                clearHoveredCargo();

            }
            function onResize() {
              if (!renderer || !canvasWrap.value) return;
              const w = canvasWrap.value.clientWidth,
                h = canvasWrap.value.clientHeight;
              if (w === 0 || h === 0) return;
              perspCamera.aspect = w / h;
              perspCamera.updateProjectionMatrix();
              renderer.setSize(w, h);
              if (viewMode.value !== "iso") computeOrthoFrustum(viewMode.value);
            }
            function computeOrthoFrustum(mode) {
              if (!orthoCamera || !canvasWrap.value || !activeRes.value) return;
              const wrap = canvasWrap.value;
              const aspect = (wrap.clientWidth || 1) / (wrap.clientHeight || 1);
              const L = activeRes.value.containerLength,
                W = activeRes.value.containerWidth,
                H = activeRes.value.containerHeight;
              const off = 350,
                pad = 700;
              let halfH, halfV;
              if (mode === "front") {
                halfH = W / 2 + off + pad;
                halfV = H / 2 + pad;
              } else if (mode === "side") {
                halfH = L / 2 + off + pad;
                halfV = H / 2 + pad;
              } else if (mode === "top") {
                halfH = L / 2 + off + pad;
                halfV = W / 2 + off + pad;
              } else {
                halfH = Math.max(W, L) / 2 + pad;
                halfV = H / 2 + pad;
              }
              const viewHalfHeight = Math.max(halfV, halfH / aspect);
              const viewHalfWidth = viewHalfHeight * aspect;
              orthoCamera.left = -viewHalfWidth;
              orthoCamera.right = viewHalfWidth;
              orthoCamera.top = viewHalfHeight;
              orthoCamera.bottom = -viewHalfHeight;
              orthoCamera.near = 1;
              orthoCamera.far = 300000;
              orthoCamera.updateProjectionMatrix();
            }
            function updateCutaway() {
              if (!containerGroup.children.length) return;
              const camDir = camera.position.clone().sub(controls.target).normalize();
              containerGroup.children[0].children.forEach((mesh) => {
                if (mesh.userData.cutawayFaces) {
                  mesh.visible = !mesh.userData.cutawayFaces.every(
                    (normal) => camDir.dot(normal) > 0.05,
                  );
                }
              });
            }
            function animate() {
              rafId = requestAnimationFrame(animate);
              if (camTarget) {
                camera.position.lerp(camTarget, 0.12);
                if (camera.position.distanceTo(camTarget) < 30) camTarget = null;
              }
              if (step.value !== 4 || document.hidden) return;
              renderPreviewFrame();
            }
            function renderPreviewFrame() {
              if (!inited || !renderer || !scene || !camera || previewFallback.value) return;
              controls && controls.update();
              updateCutaway();
              if (scene && camera) {
                const isOrtho = !!camera.isOrthographicCamera;
                scene.traverse((c) => {
                  if (c.userData.isDimText) {
                    let visibleHeight;
                    if (isOrtho) {
                      visibleHeight = (camera.top - camera.bottom) / camera.zoom;
                    } else {
                      visibleHeight =
                        2 *
                        camera.position.distanceTo(c.position) *
                        Math.tan((camera.fov * 0.5 * Math.PI) / 180);
                    }
                    const s = visibleHeight * 0.055;
                    c.scale.set(s * 4, s, 1);
                  }
                });
              }
              try {
                renderer.render(scene, camera);
              } catch (error) {
                useFallbackPreview("三维绘制中断，已切换兼容视图。");
              }
            }
            function drawContainer() {
              while (containerGroup.children.length) {
                const child = containerGroup.children[0];
                child.traverse((c) => {
                  if (c.geometry) c.geometry.dispose();
                  if (c.material) {
                    if (Array.isArray(c.material)) c.material.forEach((m) => m.dispose());
                    else {
                      if (c.material.map) c.material.map.dispose();
                      c.material.dispose();
                    }
                  }
                });
                containerGroup.remove(child);
              }
              if (!activeRes.value) return;
              const W = activeRes.value.containerWidth,
                H = activeRes.value.containerHeight,
                L = activeRes.value.containerLength;
              const model = buildPreciseContainer(W, H, L);
              containerGroup.add(model);

              const dimGroup = new THREE.Group();
              const addDim = (p1, p2, text, axis) => {
                const g = new THREE.Group();
                const mat = new THREE.LineBasicMaterial({
                  color: 0x64748b,
                  depthTest: false,
                  depthWrite: false,
                  transparent: true,
                });
                const line = new THREE.Line(
                  new THREE.BufferGeometry().setFromPoints([p1, p2]),
                  mat,
                );
                line.renderOrder = 999;
                g.add(line);
                let t1s, t1e, t2s, t2e;
                if (axis === "Z") {
                  t1s = new THREE.Vector3(W / 2, p1.y, p1.z);
                  t1e = new THREE.Vector3(p1.x + 60, p1.y, p1.z);
                  t2s = new THREE.Vector3(W / 2, p2.y, p2.z);
                  t2e = new THREE.Vector3(p2.x + 60, p2.y, p2.z);
                } else if (axis === "X") {
                  t1s = new THREE.Vector3(p1.x, p1.y, L / 2);
                  t1e = new THREE.Vector3(p1.x, p1.y, p1.z + 60);
                  t2s = new THREE.Vector3(p2.x, p2.y, L / 2);
                  t2e = new THREE.Vector3(p2.x, p2.y, p2.z + 60);
                } else if (axis === "Y") {
                  t1s = new THREE.Vector3(W / 2, p1.y, -L / 2);
                  t1e = new THREE.Vector3(p1.x + 40, p1.y, p1.z - 40);
                  t2s = new THREE.Vector3(W / 2, p2.y, -L / 2);
                  t2e = new THREE.Vector3(p2.x + 40, p2.y, p2.z - 40);
                }
                g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([t1s, t1e]), mat));
                g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([t2s, t2e]), mat));
                const canvas = document.createElement("canvas");
                canvas.width = 512;
                canvas.height = 128;
                const ctx = canvas.getContext("2d");
                ctx.fillStyle = "rgba(255,255,255,0.85)";
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(40, 20, 432, 88, 44);
                else ctx.fillRect(40, 20, 432, 88);
                ctx.fill();
                ctx.strokeStyle = "#94a3b8";
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.font = "bold 36px ClassicCN, sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#0f172a";
                ctx.fillText(text, 256, 64);
                const sprite = new THREE.Sprite(
                  new THREE.SpriteMaterial({
                    map: new THREE.CanvasTexture(canvas),
                    depthTest: false,
                    depthWrite: false,
                    transparent: true,
                  }),
                );
                sprite.position.copy(p1).lerp(p2, 0.5);
                sprite.renderOrder = 1000;
                sprite.userData.isDimText = true;
                g.add(sprite);
                return g;
              };
              const off = 350;
              dimGroup.add(
                addDim(
                  new THREE.Vector3(W / 2 + off, 0, -L / 2),
                  new THREE.Vector3(W / 2 + off, 0, L / 2),
                  `内长: ${L} mm`,
                  "Z",
                ),
              );
              dimGroup.add(
                addDim(
                  new THREE.Vector3(-W / 2, 0, L / 2 + off),
                  new THREE.Vector3(W / 2, 0, L / 2 + off),
                  `内宽: ${W} mm`,
                  "X",
                ),
              );
              dimGroup.add(
                addDim(
                  new THREE.Vector3(W / 2 + off, 0, -L / 2 - off),
                  new THREE.Vector3(W / 2 + off, H, -L / 2 - off),
                  `内高: ${H} mm`,
                  "Y",
                ),
              );
              containerGroup.add(dimGroup);
            }
            function getLabelMaterial(text) {
              if (labelCache[text]) return labelCache[text];
              const canvas = document.createElement("canvas");
              canvas.width = 512;
              canvas.height = 256;
              const ctx = canvas.getContext("2d");
              ctx.clearRect(0, 0, 512, 256);
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              function drawTextWithOutline(txt, x, y, maxWidth, font, color) {
                ctx.font = font;
                let displayText = txt;
                if (ctx.measureText(txt).width > maxWidth) {
                  let ellipsis = "...";
                  let currentWidth = ctx.measureText(ellipsis).width;
                  let newTxt = "";
                  for (let i = 0; i < txt.length; i++) {
                    let charWidth = ctx.measureText(txt[i]).width;
                    if (currentWidth + charWidth > maxWidth) break;
                    newTxt += txt[i];
                    currentWidth += charWidth;
                  }
                  displayText = newTxt + ellipsis;
                }
                ctx.lineJoin = "round";
                ctx.miterLimit = 2;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
                ctx.lineWidth = 6;
                ctx.strokeText(displayText, x, y);
                ctx.fillStyle = color;
                ctx.fillText(displayText, x, y);
              }
              const parts = text.split("\n");
              if (parts.length === 2) {
                const isPallet = parts[1].includes("打托");
                drawTextWithOutline(
                  parts[0],
                  256,
                  90,
                  460,
                  "bold 64px ClassicCN, sans-serif",
                  "#0f172a",
                );
                drawTextWithOutline(
                  parts[1],
                  256,
                  184,
                  460,
                  isPallet ? "700 48px ClassicCN, sans-serif" : "900 92px ClassicCN, sans-serif",
                  "#1e40af",
                );
              } else {
                drawTextWithOutline(
                  text,
                  256,
                  128,
                  460,
                  "bold 68px ClassicCN, sans-serif",
                  "#0f172a",
                );
              }
              const tex = new THREE.CanvasTexture(canvas);
              tex.encoding = THREE.sRGBEncoding;
              tex.minFilter = THREE.LinearFilter;
              tex.magFilter = THREE.LinearFilter;
              tex.generateMipmaps = false;
              tex.anisotropy = 1;
              const mat = new THREE.MeshBasicMaterial({
                map: tex,
                transparent: true,
                depthTest: true,
                depthWrite: false,
                polygonOffset: true,
                polygonOffsetFactor: -3,
                polygonOffsetUnits: -3,
              });
              labelCache[text] = mat;
              return mat;
            }
            // 为打托货物的整组外围添加虚线边界框
            function addPalletBoundaryBox(group, p, isHighlight = true) {
              if (!p.palletized) return;
              const columns = Math.max(1, Number(p.palletColumns) || 1);
              const layers = Math.max(1, Number(p.palletLayers) || 1);
              if (columns === 1 && layers === 1) return;

              const hW = p.dz / 2,
                hH = p.dy / 2,
                hD = p.dx / 2;
              const boundaryGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(p.dz, p.dy, p.dx));
              const boundaryMat = new THREE.LineDashedMaterial({
                color: 0x0f172a,
                transparent: true,
                opacity: 0.7,
                depthTest: true,
                linewidth: 1,
              });
              const boundary = new THREE.LineSegments(boundaryGeo, boundaryMat);
              boundary.computeLineDistances();
              boundary.renderOrder = 3;
              group.add(boundary);
            }

            // 构建一个打托物品的子箱体组（columns x layers 个独立小箱）
            function buildPalletSubBoxes(p, baseColor, isHighlight, transparentMode) {
              const columns = Math.max(1, Number(p.palletColumns) || 1);
              const layers = Math.max(1, Number(p.palletLayers) || 1);
              if (columns <= 1 && layers <= 1) return null; // 不需要拆分

              const gap = 0; // 不用实体缝隙篡改外形尺寸，视觉分隔由虚线完成
              const totalDx = p.dx; // 沿 Z 轴（算法中的长）
              const totalDy = p.dy; // 沿 Y 轴（算法中的高）
              const totalDz = p.dz; // 沿 X 轴（算法中的宽）

              const subDx = (totalDx - gap * (columns - 1)) / columns;
              const subDy = (totalDy - gap * (layers - 1)) / layers;
              const subDz = totalDz; // 宽度方向不拆分

              const subGroup = new THREE.Group();

              for (let layer = 0; layer < layers; layer++) {
                for (let col = 0; col < columns; col++) {
                  const subGeo = new THREE.BoxGeometry(subDz, subDy, subDx);
                  const mat = new THREE.MeshStandardMaterial({
                    color: baseColor.clone(),
                    roughness: 0.65,
                    metalness: 0.05,
                    polygonOffset: true,
                    polygonOffsetFactor: 1,
                    polygonOffsetUnits: 1,
                    visible: !transparentMode,
                    transparent: transparentMode,
                    opacity: transparentMode ? 0.25 : 1.0,
                    emissive: isHighlight
                      ? baseColor.clone().multiplyScalar(0.18)
                      : new THREE.Color(0x000000),
                  });
                  const subMesh = new THREE.Mesh(subGeo, mat);

                  // 计算子箱在父组内的局部坐标（相对于打托组合体的中心）
                  const localZ = -totalDx / 2 + subDx / 2 + col * (subDx + gap);
                  const localY = -totalDy / 2 + subDy / 2 + layer * (subDy + gap);
                  const localX = 0; // 宽度方向居中
                  subMesh.position.set(localX, localY, localZ);

                  const edges = new THREE.LineSegments(
                    new THREE.EdgesGeometry(subGeo),
                    new THREE.LineBasicMaterial({
                      color: isHighlight ? 0x0f172a : 0x334155,
                      transparent: true,
                      opacity: isHighlight ? 0.45 : 0.2,
                    }),
                  );
                  edges.renderOrder = 1;
                  subMesh.add(edges);
                  subGroup.add(subMesh);
                }
              }
              return subGroup;
            }

            function drawBoxes(placed, currentStepIndices = null) {
              previewCargoCount.value = placed.reduce((n, p) => n + (Number(p.pieceCount) || 1), 0);
              restoreDimmedCargo();
              clearHoveredCargo();
              Object.values(labelCache).forEach((m) => {
                if (m.map) m.map.dispose();
                m.dispose();
              });
              labelCache = {};
              while (boxesGroup.children.length) {
                const child = boxesGroup.children[0];
                child.traverse((c) => {
                  if (c.geometry) c.geometry.dispose();
                  if (c.material) c.material.dispose();
                });
                boxesGroup.remove(child);
              }
              if (!activeRes.value) return;
              const W = activeRes.value.containerWidth,
                L = activeRes.value.containerLength;
              addResultPalletVisuals(
                boxesGroup,
                activeRes.value,
                placed.length - 1,
                currentStepIndices,
              );
              placed.forEach((p, i) => {
                const baseColor = new THREE.Color(p.color);
                const isCurrentStep = !currentStepIndices || currentStepIndices.has(i);
                const displayColor = baseColor;
                const isPalletSplit =
                  p.palletized &&
                  (Math.max(1, Number(p.palletColumns) || 1) > 1 ||
                    Math.max(1, Number(p.palletLayers) || 1) > 1);

                // 创建容器 group（无论是否打托都用 group 以保持统一）
                const container = new THREE.Group();
                container.userData.pickableCargo = p;
                container.position.set(
                  p.z - W / 2 + p.dz / 2,
                  p.y + p.dy / 2,
                  p.x - L / 2 + p.dx / 2,
                );

                if (isPalletSplit) {
                  // 打托货物：渲染为独立子箱体
                  const subGroup = buildPalletSubBoxes(p, displayColor, isCurrentStep, false);
                  if (subGroup) container.add(subGroup);
                  // 添加虚线外边界
                  addPalletBoundaryBox(container, p, isCurrentStep);
                } else {
                  // 普通货物：整体箱体
                  const geo = new THREE.BoxGeometry(p.dz, p.dy, p.dx);
                  const material = new THREE.MeshStandardMaterial({
                    color: displayColor,
                    roughness: 0.65,
                    metalness: 0.05,
                    polygonOffset: true,
                    polygonOffsetFactor: 1,
                    polygonOffsetUnits: 1,
                  });
                  const mesh = new THREE.Mesh(geo, material);
                  const edges = new THREE.LineSegments(
                    new THREE.EdgesGeometry(geo),
                    new THREE.LineBasicMaterial({
                      color: 0x1e293b,
                      transparent: true,
                      opacity: 0.4,
                    }),
                  );
                  edges.renderOrder = 1;
                  mesh.add(edges);
                  container.add(mesh);
                }

                // 标签渲染
                let occludedTop = false,
                  occludedFront = false,
                  occludedBack = false,
                  occludedLeft = false,
                  occludedRight = false;
                for (const b of placed) {
                  if (b === p) continue;
                  if (!occludedTop && Math.abs(b.y - (p.y + p.dy)) < 1) {
                    const cx = p.x + p.dx / 2;
                    const cz = p.z + p.dz / 2;
                    if (cx > b.x && cx < b.x + b.dx && cz > b.z && cz < b.z + b.dz)
                      occludedTop = true;
                  }
                  if (!occludedFront && Math.abs(b.x - (p.x + p.dx)) < 1) {
                    const cy = p.y + p.dy / 2;
                    const cz = p.z + p.dz / 2;
                    if (cy > b.y && cy < b.y + b.dy && cz > b.z && cz < b.z + b.dz)
                      occludedFront = true;
                  }
                  if (!occludedBack && Math.abs(b.x + b.dx - p.x) < 1) {
                    const cy = p.y + p.dy / 2;
                    const cz = p.z + p.dz / 2;
                    if (cy > b.y && cy < b.y + b.dy && cz > b.z && cz < b.z + b.dz)
                      occludedBack = true;
                  }
                  if (!occludedRight && Math.abs(b.z - (p.z + p.dz)) < 1) {
                    const cx = p.x + p.dx / 2;
                    const cy = p.y + p.dy / 2;
                    if (cx > b.x && cx < b.x + b.dx && cy > b.y && cy < b.y + b.dy)
                      occludedRight = true;
                  }
                  if (!occludedLeft && Math.abs(b.z + b.dz - p.z) < 1) {
                    const cx = p.x + p.dx / 2;
                    const cy = p.y + p.dy / 2;
                    if (cx > b.x && cx < b.x + b.dx && cy > b.y && cy < b.y + b.dy)
                      occludedLeft = true;
                  }
                  if (occludedTop && occludedFront && occludedBack && occludedLeft && occludedRight)
                    break;
                }
                if (
                  !occludedTop ||
                  !occludedFront ||
                  !occludedBack ||
                  !occludedLeft ||
                  !occludedRight
                ) {
                  const count = p.pieceCount || 1;
                  const name = p.cargoName || p.name.replace(/\s*\[Pallet\]$/, "");
                  let text = `${name}\n(${count}件)`;
                  const isPalletSplit =
                    p.palletized &&
                    (Math.max(1, Number(p.palletColumns) || 1) > 1 ||
                      Math.max(1, Number(p.palletLayers) || 1) > 1);
                  if (isPalletSplit) {
                    text = `${name}\n(打托: 1托, ${count}件)`;
                  }

                  const baseLabelMaterial = getLabelMaterial(text);
                  // 已完成步骤保留同样的文字信息，但降低对当前装载步骤的视觉干扰。
                  const mat = isCurrentStep ? baseLabelMaterial : baseLabelMaterial.clone();
                  if (!isCurrentStep) {
                    mat.transparent = true;
                    mat.opacity = 0.4;
                    mat.depthWrite = false;
                  }
                  if (!occludedTop) {
                    const w = Math.min(p.dz * 0.9, p.dx * 1.8);
                    const h = w * 0.5;
                    const topLabel = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
                    topLabel.rotation.x = -Math.PI / 2;
                    topLabel.position.set(0, p.dy / 2 + 3.0, 0);
                    container.add(topLabel);
                  }
                  if (!occludedFront) {
