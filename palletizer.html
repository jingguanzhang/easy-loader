<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>混合打托编辑器</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
    />
    <script>
      addEventListener("load", function () {
        var t = document.createElement("i");
        t.className = "ri-check-line";
        t.style.cssText = "position:absolute;visibility:hidden";
        document.body.appendChild(t);
        var f = getComputedStyle(t, ":before").fontFamily.toLowerCase();
        t.remove();
        if (f.indexOf("remixicon") < 0) {
          var l = document.createElement("link");
          l.rel = "stylesheet";
          l.href = "vendor/remixicon.css";
          document.head.appendChild(l);
        }
      });
    </script>
    <style>
      /* 混合打托组合编辑器 · v4.9 布局：小屏优先的紧凑桌面风 */
      :root {
        font:
          12px Tahoma,
          "Microsoft YaHei",
          sans-serif;
        color: #365b72;
        background: #edf0ed;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #pe-app {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        border: 1px solid #9bacb5;
        background: linear-gradient(#fff, #e3e9e6);
        padding: 2px 6px;
        min-height: 26px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        box-shadow: inset 1px 1px #fff;
      }
      button:hover:not(:disabled) {
        background: #e5eff4;
        border-color: #759aaf;
      }
      button:disabled {
        opacity: 0.48;
        cursor: default;
      }
      .primary,
      button.active {
        background: #dceaf4;
        border-color: #5f91b2;
      }
      .icon {
        width: 16px;
        height: 16px;
        object-fit: contain;
        flex: none;
        border: 0;
      }
      .icon.small {
        width: 14px;
        height: 14px;
      }
      i[class^="ri-"],
      i[class*=" ri-"] {
        font-size: 15px;
        line-height: 1;
        display: inline-flex;
      }
      input:not([type="checkbox"]) {
        border: 1px solid #a6b8c3;
        background: #fff;
        min-width: 0;
        padding: 3px 5px;
        height: 26px;
        width: 100%;
      }
      input:focus {
        outline: 1px solid #7bacc7;
      }
      input[type="checkbox"] {
        accent-color: #3c7193;
        cursor: pointer;
      }

      .editor-shell {
        height: 100%;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      /* ── 标题栏：操作出口集中于此，不再占工具栏 ─────────────── */
      .pe-title {
        height: 32px;
        background: #244d6a;
        color: #eef4f6;
        padding: 4px 8px;
        display: flex;
        align-items: center;
        gap: 7px;
        flex: none;
      }
      .pe-title b {
        font-size: 12px;
      }
      .pe-title-actions {
        margin-left: auto;
        display: flex;
        gap: 5px;
      }
      .pe-title-actions .ti-btn {
        min-height: 24px;
        padding: 2px 8px;
        background: transparent;
        border-color: #4d7391;
        color: #dce6ea;
        box-shadow: none;
      }
      .pe-title-actions .ti-btn:hover:not(:disabled) {
        background: #2f5b7c;
        border-color: #6d93ab;
      }
      .pe-title-actions .ti-btn.primary {
        background: #3c7193;
        border-color: #7ba8c4;
        color: #fff;
      }

      /* ── 工具栏：图标分组，悬停出说明 ─────────────────────── */
      .pe-toolbar {
        padding: 4px 6px;
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        border-bottom: 1px solid #a6b8c3;
        flex: none;
        background: #edf0ea;
      }
      .tb-group {
        display: flex;
        gap: 2px;
        padding-right: 8px;
        border-right: 1px solid #c4cfd3;
      }
      .tb-group:last-child {
        border-right: 0;
        padding-right: 0;
      }
      .tb-group button {
        min-width: 28px;
        padding: 2px 5px;
      }
      .tb-text {
        font-size: 12px;
      }

      /* ── 组合条 ─────────────────────────────────────────── */
      .group-strip {
        padding: 4px 8px;
        display: flex;
        align-items: center;
        gap: 11px;
        background: #f5f7f3;
        border-bottom: 1px solid #b5c4cb;
        flex: none;
        flex-wrap: wrap;
      }
      .group-strip label {
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .group-strip .gs-name input {
        width: 180px;
        font-weight: bold;
      }
      .group-strip .gs-copies input {
        width: 64px;
      }
      .gs-stats {
        margin-left: auto;
        color: #7892a1;
        font-size: 11px;
        white-space: nowrap;
      }
      .reuse-inline {
        display: flex;
        gap: 4px;
      }
      .reuse-inline button {
        min-height: 24px;
        padding: 2px 7px;
        white-space: nowrap;
      }
      .copy-switch {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .copy-switch b {
        font-size: 11px;
        color: #1f4a66;
        white-space: nowrap;
      }
      .copy-switch > button {
        min-height: 24px;
        padding: 2px 5px;
      }
      .copy-badge {
        font-style: normal;
        font-size: 10px;
        color: #7b93a0;
        border: 1px solid #b8c8d0;
        padding: 1px 6px;
        background: #fbfdfc;
        border-radius: 2px;
        white-space: nowrap;
      }
      .copy-badge.custom {
        color: #8a5a1e;
        border-color: #d9b071;
        background: #fdf4e2;
      }
      .copy-reset {
        min-height: 22px;
        padding: 1px 7px;
        font-size: 10px;
        white-space: nowrap;
      }

      /* ── 三区工作区 ─────────────────────────────────────── */
      .pe-workspace {
        display: flex;
        flex: 1;
        min-height: 180px;
        overflow: hidden;
      }
      .panel-box {
        background: #f5f7f3;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .sources {
        width: 196px;
        flex: none;
        border-right: 1px solid #afbec5;
        overflow-y: auto;
        padding: 0 7px 7px;
      }
      .properties {
        width: 250px;
        flex: none;
        border-left: 1px solid #afbec5;
        overflow: hidden;
      }
      .panel-title {
        min-height: 27px;
        background: #e2e9e8;
        border-bottom: 1px solid #adbdc6;
        padding: 5px 8px;
        display: flex;
        align-items: center;
        gap: 7px;
        font-weight: bold;
        flex: none;
      }
      .panel-title span {
        font-size: 10px;
        color: #7b93a0;
        margin-left: auto;
        font-weight: normal;
      }
      .panel-title i {
        font-size: 14px;
      }

      /* 货源 */
      .source-search {
        margin: 7px 0;
        position: relative;
      }
      .source-search i {
        position: absolute;
        left: 6px;
        top: 50%;
        transform: translateY(-50%);
        color: #8aa0ab;
        pointer-events: none;
      }
      .source-search input {
        padding-left: 22px;
      }
      .source-list {
        border: 1px solid #bbcbd1;
        background: #fafbf7;
        margin-bottom: 7px;
      }
      .source-row {
        width: 100%;
        text-align: left;
        display: grid;
        grid-template-columns: 12px minmax(0, 1fr);
        gap: 3px;
        border: 0;
        border-bottom: 1px solid #d2dce0;
        padding: 5px 6px;
        background: #fafbf7;
        box-shadow: none;
        line-height: 1.35;
      }
      .source-row.selected {
        background: #e0edf7;
      }
      .source-row b {
        font-weight: normal;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .source-row small {
        grid-column: 2;
        font-size: 10px;
        color: #7a949f;
      }
      .source-color {
        width: 10px;
        height: 10px;
        border: 1px solid #0002;
        margin-top: 3px;
      }
      .source-row:last-child {
        border-bottom: 0;
      }
      .add-row {
        display: flex;
        gap: 5px;
        align-items: end;
        margin-bottom: 4px;
      }
      .add-row label {
        display: flex;
        flex-direction: column;
        font-size: 10px;
        gap: 2px;
        flex: 1;
      }
      .add-row button {
        white-space: nowrap;
      }
      .grid-gen {
        border-top: 1px dashed #c0ccd1;
        margin-top: 7px;
        padding-top: 5px;
      }
      .grid-gen > summary {
        font-size: 11px;
        font-weight: bold;
        color: #557c93;
        cursor: pointer;
        padding: 2px 0;
      }
      .grid-fields {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
        margin: 6px 0;
      }
      .grid-fields label,
      .form-grid label {
        font-size: 10px;
        line-height: 1.6;
      }
      .grid-gen button {
        width: 100%;
        justify-content: center;
      }
      .grid-gen p {
        margin-top: 5px;
      }

      /* 参数面板选项卡 */
      .prop-tabs {
        display: flex;
        flex: none;
        background: #e2e9e8;
        border-bottom: 1px solid #adbdc6;
      }
      .prop-tabs button {
        flex: 1;
        justify-content: center;
        border: 0;
        border-right: 1px solid #adbdc6;
        background: transparent;
        box-shadow: none;
        min-height: 30px;
        gap: 5px;
        position: relative;
        border-radius: 0;
      }
      .prop-tabs button:last-child {
        border-right: 0;
      }
      .prop-tabs button.active {
        background: #f5f7f3;
        border-bottom: 2px solid #3c7193;
        font-weight: bold;
        color: #2c5878;
      }
      .tab-badge {
        background: #5b8db8;
        color: #fff;
        border-radius: 8px;
        font-size: 9px;
        padding: 0 5px;
        line-height: 13px;
        min-width: 13px;
        text-align: center;
      }
      .tab-badge.warn {
        background: #bd7766;
      }
      .prop-body {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
      }
      .prop-h {
        margin: 0 0 7px;
        font-size: 11px;
        color: #557c93;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      /* 选中件朝向 */
      .orientation-choices {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        margin-top: 7px;
      }
      .orientation-choices button {
        display: flex;
        flex-direction: column;
        gap: 0;
        align-items: center;
        min-width: 0;
        padding: 3px;
      }
      .orientation-choices span {
        width: 40px;
        height: 36px;
      }
      .orientation-choices svg {
        width: 100%;
        height: 100%;
      }
      .orientation-choices small {
        font-size: 9px;
        white-space: nowrap;
      }
      .coordinate-fields {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
        font-size: 10px;
      }

      /* 校验 */
      .error-list {
        max-height: 150px;
        overflow: auto;
        margin-bottom: 6px;
      }
      .error-list button {
        display: block;
        width: 100%;
        border: 0;
        border-bottom: 1px solid #e8ddca;
        background: #fff8e8;
        box-shadow: none;
        color: #98713c;
        font-size: 10px;
        line-height: 1.5;
        text-align: left;
        padding: 5px;
      }
      .good {
        color: #648663;
      }
      p {
        font-size: 10px;
        color: #7f98a4;
        line-height: 1.6;
        margin: 6px 0 1px;
      }

      /* ── 中部视图 ───────────────────────────────────────── */
      .visual {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
        min-height: 0;
        background: #f1f5f1;
      }
      .view-bar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 3px;
        padding: 3px 5px;
        border-bottom: 1px solid #bdcbd2;
        font-size: 10px;
        flex: none;
      }
      .view-bar button {
        min-height: 23px;
        padding: 2px 5px;
        gap: 4px;
      }
      .view-bar label {
        display: flex;
        gap: 3px;
        align-items: center;
        white-space: nowrap;
      }
      .view-bar input[type="number"] {
        width: 42px;
        height: 23px;
      }
      .dock-check {
        color: #66808e;
      }
      .view-bar span {
        margin-left: auto;
        color: #91a2a8;
      }
      .viewport {
        position: relative;
        flex: 1;
        min-height: 120px;
        overflow: hidden;
        background: #f7faf6;
      }
      .viewport canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .visual-overlay,
      .visual-readout {
        position: absolute;
        pointer-events: none;
        z-index: 2;
        padding: 7px;
        font-size: 10px;
        line-height: 1.65;
        color: #809aa7;
      }
      .visual-overlay {
        top: 0;
        left: 0;
      }
      .visual-readout {
        bottom: 0;
        right: 0;
        background: #fafdfacc;
        color: #456a80;
        text-align: right;
      }
      .visual-foot {
        padding: 4px 8px;
        font-size: 10px;
        color: #8ba0ab;
        border-top: 1px solid #c7d3d8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ── 底部清单与状态 ─────────────────────────────────── */
      .member-panel {
        height: 150px;
        min-height: 78px;
        max-height: 32vh;
        display: flex;
        flex-direction: column;
        border-top: 1px solid #a2b6c2;
        flex: none;
      }
      .member-panel.collapsed {
        height: 33px;
        min-height: 0;
        max-height: 33px;
      }
      .member-panel .panel-title button {
        font-size: 10px;
        min-height: 22px;
        padding: 1px 6px;
      }
      .member-scroll {
        overflow: auto;
        flex: 1;
        background: #fafcf9;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        white-space: nowrap;
      }
      th {
        position: sticky;
        top: 0;
        background: #e7edeb;
        color: #6d899a;
        z-index: 1;
        font-weight: normal;
        padding: 4px 7px;
        border-bottom: 1px solid #b3c4ce;
        text-align: left;
      }
      td {
        border-right: 1px solid #e0e6e8;
        border-bottom: 1px solid #e0e6e8;
        padding: 3px 7px;
        font-size: 11px;
      }
      tbody tr {
        cursor: pointer;
      }
      tr.selected {
        background: #e3eff8;
      }
      tr.invalid {
        color: #a5734d;
      }
      td:nth-child(n + 5) {
        font-family: Tahoma, sans-serif;
        font-size: 10px;
      }
      .status-line {
        height: 25px;
        border-top: 1px solid #b9c8ce;
        padding: 4px 8px;
        display: flex;
        justify-content: space-between;
        color: #8097a4;
        font-size: 10px;
        flex: none;
      }
      .status-line .error {
        color: #a55f46;
      }
      .status-line .success {
        color: #578052;
      }
      .empty,
      .waiting {
        padding: 25px;
        text-align: center;
        color: #829aa7;
      }
      .busy {
        position: absolute;
        inset: 30px 0 0;
        z-index: 50;
        background: #243f5266;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .busy > div {
        width: 340px;
        background: #fafbf6;
        border: 1px solid #7d97a7;
        box-shadow: 4px 4px #172b3020;
        padding: 20px;
      }
      .busy p {
        margin: 12px 0;
      }
      .busy button {
        margin-top: 8px;
      }
      [v-cloak] {
        display: none;
      }

      /* ── 笔记本小屏（≤1170px）：面板改作悬靠抽屉的开关收起 ── */
      @media (max-width: 1170px) {
        .sources {
          width: 184px;
        }
        .properties {
          width: 238px;
        }
        .group-strip {
          gap: 8px;
        }
        .group-strip .gs-name input {
          width: 130px;
        }
        .gs-stats {
          display: none;
        }
        .tb-text {
          display: none;
        }
        .tb-group {
          padding-right: 6px;
        }
      }
      @media (max-width: 880px) {
        .pe-workspace {
          overflow: auto;
        }
        .sources {
          width: 172px;
        }
        .properties {
          width: 226px;
        }
        .group-strip {
          font-size: 10px;
          gap: 6px;
          overflow-x: auto;
          white-space: nowrap;
          flex-wrap: nowrap;
        }
        .group-strip .gs-name input {
          width: 110px;
        }
        .group-strip .gs-copies input {
          width: 48px;
        }
        .member-panel {
          height: 120px;
        }
        .pe-title b {
          display: none;
        }
        .visual-readout {
          font-size: 9px;
        }
        .view-bar .vb-text {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="pe-app" v-cloak></div>
    <template id="pe-template"
      ><div class="editor-shell" @pointerdown="dismissMessage">
        <header class="pe-title">
          <app-icon name="pallet" class="small"></app-icon><b>混合打托组合编辑器</b>
          <span class="pe-title-actions">
            <button
              class="ti-btn"
              @click="cancel"
              aria-label="取消"
              title="取消，放弃所有改动 (Esc)"
            >
              <i class="ri-close-line" aria-hidden="true"></i><span>取消</span>
            </button>
            <button
              class="ti-btn"
              @click="save(false)"
              :disabled="busy"
              aria-label="保存草稿"
              title="保存草稿，未参与装载 (Ctrl+Shift+S)"
            >
              <i class="ri-save-3-line" aria-hidden="true"></i><span>保存草稿</span>
            </button>
            <button
              class="ti-btn primary"
              @click="save(true)"
              :disabled="busy || !canCommit"
              aria-label="保存并参与装载"
              title="保存并参与装载 (Ctrl+S)"
              data-testid="commit-pallet"
            >
              <i class="ri-check-line" aria-hidden="true"></i><span>保存并参与装载</span>
            </button>
          </span>
        </header>
        <div v-if="!initialized" class="waiting">请从组合打托页面创建或编辑组合。</div>
        <template v-else>
          <div class="pe-toolbar">
            <div class="tb-group">
              <button
                @click="undo"
                :disabled="historyIndex <= 0 || busy"
                aria-label="撤销"
                title="撤销 (Ctrl+Z)"
              >
                <i class="ri-arrow-go-back-line" aria-hidden="true"></i>
              </button>
              <button
                @click="redo"
                :disabled="historyIndex >= history.length - 1 || busy"
                aria-label="重做"
                title="重做 (Ctrl+Y)"
              >
                <i class="ri-arrow-go-forward-line" aria-hidden="true"></i>
              </button>
            </div>
            <div class="tb-group">
              <button
                @click="copySelected"
                :disabled="!selectedIds.length || busy"
                aria-label="复制件"
                title="复制选中单件 (Ctrl+D)"
              >
                <i class="ri-file-copy-line" aria-hidden="true"></i>
              </button>
              <button
                @click="deleteSelected"
                :disabled="!selectedIds.length || busy"
                aria-label="删除件"
                title="删除选中单件 (Delete)"
              >
                <i class="ri-delete-bin-line" aria-hidden="true"></i>
              </button>
              <button
                @click="rotateSelected"
                :disabled="!selectedIds.length || busy"
                aria-label="旋转 R"
                title="旋转 90° (R)"
              >
                <i class="ri-clockwise-2-line" aria-hidden="true"></i>
              </button>
            </div>
            <div class="tb-group">
              <button
                :class="{ active: tool === 'move' }"
                @click="tool = 'move'"
                aria-label="移动 / 选择"
                title="移动 / 选择：左键选取、拖动单件"
              >
                <i class="ri-drag-move-2-line" aria-hidden="true"></i>
              </button>
              <button
                :class="{ active: tool === 'orbit' }"
                @click="tool = 'orbit'"
                aria-label="查看 / 轨道"
                title="查看 / 轨道：环绕视角，不改动货物"
              >
                <i class="ri-eye-line" aria-hidden="true"></i>
              </button>
            </div>
            <div class="tb-group">
              <button
                @click="moveLayer(1)"
                :disabled="!selectedIds.length || busy"
                aria-label="上移一层"
                title="上移一层 (PageUp)"
                data-testid="raise-layer"
              >
                <i class="ri-arrow-up-s-line" aria-hidden="true"></i>
              </button>
              <button
                @click="moveLayer(-1)"
                :disabled="!selectedIds.length || busy"
                aria-label="下移一层"
                title="下移一层 (PageDown)"

    <script>
      /* Shared pure geometry/validation for main app and the independent pallet editor. */
      const PalletGeometry = (() => {
        const EPS = 1e-6,
          TOL = 0.001,
          number = (v) => typeof v === "number" && Number.isFinite(v),
          positive = (v) => number(v) && v > EPS,
          int = (v, min = 1) => number(v) && Number.isInteger(v) && v >= min;
        const copy = (x) => JSON.parse(JSON.stringify(x)),
          color = (v) => (/^#[0-9a-f]{6}$/i.test(v || "") ? v : "#5b8db8");
        function dims(item, n) {
          const { l, w, h } = item || {};
          return (
            [
              [l, h, w],
              [w, h, l],
              [h, l, w],
              [w, l, h],
              [l, w, h],
              [h, w, l],
            ][Number(n)]?.map(Number) || [0, 0, 0]
          );
        }
        const allowed = (it, n) => !!it && n >= 0 && n <= 5 && !!it["rot" + n];
        function svg(it, n) {
          const [dx, dy, dz] = dims(it, n);
          if (![dx, dy, dz].every(positive)) return "";
          let pts = [
            [0, 0, 0],
            [dx, 0, 0],
            [dx, 0, dz],
            [0, 0, dz],
            [0, dy, 0],
            [dx, dy, 0],
            [dx, dy, dz],
            [0, dy, dz],
          ].map((p) => ({ x: (p[0] - p[2]) * 0.866, y: -p[1] + (p[0] + p[2]) * 0.5 }));
          const xs = pts.map((p) => p.x),
            ys = pts.map((p) => p.y),
            minX = Math.min(...xs),
            maxX = Math.max(...xs),
            minY = Math.min(...ys),
            maxY = Math.max(...ys),
            s = Math.min(36 / (maxX - minX || 1), 36 / (maxY - minY || 1)),
            ox = 25 - (minX + (maxX - minX) / 2) * s,
            oy = 25 - (minY + (maxY - minY) / 2) * s;
          pts = pts.map((p) => ({ x: p.x * s + ox, y: p.y * s + oy }));
          const poly = (ids, overlay) =>
            `<polygon points="${ids.map((i) => pts[i].x + "," + pts[i].y).join(" ")}" fill="${color(it.color)}"/><polygon points="${ids.map((i) => pts[i].x + "," + pts[i].y).join(" ")}" fill="${overlay}"/>`;
          return `<svg viewBox="0 0 50 50" class="cargo-svg-thumb" aria-hidden="true">${poly([4, 5, 6, 7], "rgba(255,255,255,.25)")}${poly([1, 5, 6, 2], "rgba(0,0,0,.25)")}${poly([3, 7, 6, 2], "rgba(0,0,0,.1)")}</svg>`;
        }
        function source(m, items) {
          return (
            items.find((i) => i.uid === m.itemUid) || items.find((i) => i.name === m.cargoName)
          );
        }
        function box(m, items) {
          const item = source(m, items);
          if (!item) return null;
          const [dx, dy, dz] = dims(item, m.orientation);
          return {
            ...m,
            x: Number(m.x),
            y: Number(m.y),
            z: Number(m.z),
            dx,
            dy,
            dz,
            item,
            color: color(item.color),
            cargoName: item.name,
            level: 1,
          };
        }
        const overlap = (a, b) =>
          Math.max(0, Math.min(a.x + a.dx, b.x + b.dx) - Math.max(a.x, b.x)) *
          Math.max(0, Math.min(a.z + a.dz, b.z + b.dz) - Math.max(a.z, b.z));
        const collision = (a, b) =>
          overlap(a, b) > EPS && a.y < b.y + b.dy - EPS && a.y + a.dy > b.y + EPS;

              const light = new THREE.DirectionalLight(0xffffff, 0.75);
              light.position.set(2000, 4000, 3000);
              scene.add(light);
              scene.add(new THREE.HemisphereLight(0xffffff, 0x73897a, 0.6));
              camera = new THREE.PerspectiveCamera(45, 1, 1, 100000);
              ortho = new THREE.OrthographicCamera(-1000, 1000, 1000, -1000, 1, 100000);
              controls = new THREE.OrbitControls(camera, canvas);
              controls.enableDamping = true;
              controls.dampingFactor = 0.08;
              controls.enableZoom = false;
              controls.minDistance = 20;
              controls.maxDistance = 90000;
              controls.minZoom = 0.05;
              controls.maxZoom = 120;
              controls.maxPolarAngle = Math.PI / 2 + 0.1;
              controls.screenSpacePanning = true;
              controls.mouseButtons.MIDDLE = THREE.MOUSE.PAN;
              /* 与主视图一致：左键环绕/右键平移/中键平移，滚轮缩放仍锚定指针 */ zoomNdc =
                new THREE.Vector2();
              meshGroup = new THREE.Group();
              window.__PE_MESHES__ = meshGroup;
              scene.add(meshGroup);
              palletVisual = new THREE.Group();
              scene.add(palletVisual);
              raycaster = new THREE.Raycaster();
              pointer = new THREE.Vector2();
            } catch (e) {
              if (renderer) {
                renderer.dispose();
                renderer = null;
              }
              viewport.value.querySelectorAll("canvas").forEach((c) => c.remove());
              fallback.value = true;
              canvas = document.createElement("canvas");
              viewport.value.appendChild(canvas);
            }
            canvas.addEventListener("pointerdown", pointerDown);
            canvas.addEventListener("pointermove", pointerMove);
            canvas.addEventListener("pointerup", pointerUp);
            canvas.addEventListener("pointercancel", pointerUp);
            canvas.addEventListener("wheel", onZoom, { passive: false, capture: true });
            observer = new ResizeObserver(resize);
            observer.observe(viewport.value);
            resize();
            fitView();
            drawVisual();
            animate();
          }
          function disposeChildren(g) {
            while (g?.children.length) {
              const c = g.children[0];
              c.traverse((o) => {
                o.geometry?.dispose();
                if (o.material) {
                  for (const m of Array.isArray(o.material) ? o.material : [o.material])
                    m.dispose();
                }
              });
              g.remove(c);
            }
          }
          function queueDraw() {
            if (drawPending) return;
            drawPending = true;
            requestAnimationFrame(() => {
              drawPending = false;
              drawVisual();
            });
          }
          function drawVisual() {
            if (!initialized.value || !canvas) return;
            const v = validation.value,
              { L, W, H, ph } = frameSize();
            if (fallback.value) {
              canvas.width = Math.max(1, viewport.value.clientWidth * (devicePixelRatio || 1));
              canvas.height = Math.max(1, viewport.value.clientHeight * (devicePixelRatio || 1));
              const parts = v.boxes.map((b) => ({
                ...b,
                cargoName: b.item.name,
                color: memberErrors(b.id).length ? "#bd7766" : b.color,
                y: b.y + ph,
              }));
              const result = {
                containerLength: L,
                containerWidth: W,
                containerHeight: H,
                palletBases: ph
                  ? [
                      {
                        x: 0,
                        y: 0,
                        z: 0,
                        dx: dimensions.value.length,
                        dy: ph,
                        dz: dimensions.value.width,
                        color: "#af8d62",
                        firstItemIndex: 0,
                        editorPreview: true,
                        weight: group.value.pallet.weight,
                      },
                    ]
                  : [],
              };
              fallbackHits = drawPackingDiagram(
                canvas.getContext("2d"),
                canvas.width,
                canvas.height,
                result,
                parts,
                view.value,
                null,
                true,
                false,
              );
              if (selectedIds.value.length) {
                const ctx2 = canvas.getContext("2d");
                ctx2.save();
                ctx2.strokeStyle = "#0f5f9e";
                ctx2.lineWidth = 3 * (devicePixelRatio || 1);
                for (const h of fallbackHits)
                  if (selectedIds.value.includes(h.item.id)) {
                    ctx2.beginPath();
                    h.points.forEach((p2, i2) => (i2 ? ctx2.lineTo(...p2) : ctx2.moveTo(...p2)));
                    ctx2.closePath();
                    ctx2.stroke();
                  }
                ctx2.restore();
              }
              return;
            }
            const boardL = clean(dimensions.value.length),
              boardW = clean(dimensions.value.width),
              signature = [L, W, H, ph, boardL, boardW, !!group.value.pallet].join("|");
            if (signature !== frameSignature) {
              frameSignature = signature;
              disposeChildren(palletVisual);
              const slab = group.value.pallet ? createPalletVisual(boardL, ph, boardW) : null;
              if (slab) {
                slab.position.set(boardL / 2, 0, boardW / 2);
                palletVisual.add(slab);
              }
              const floor = new THREE.GridHelper(Math.max(L, W) * 1.2, 20, 0x9eafb5, 0xd9e2dc);
              floor.position.set(L / 2, -0.5, W / 2);
              palletVisual.add(floor);
              const frame = new THREE.LineSegments(
                new THREE.EdgesGeometry(new THREE.BoxGeometry(L, H, W)),
                new THREE.LineBasicMaterial({ color: 0xa8b9be, transparent: true, opacity: 0.35 }),
              );
              frame.position.set(L / 2, H / 2, W / 2);
              palletVisual.add(frame);
            }
            const present = new Set(v.boxes.map((b) => b.id));
            for (const [id, mesh] of meshCache)
              if (!present.has(id)) {
                meshGroup.remove(mesh);
                mesh.traverse((o) => {
                  o.geometry?.dispose();
                  o.material?.dispose();
                });
                meshCache.delete(id);
              }
            for (const b of v.boxes) {
              if (![b.x, b.y, b.z, b.dx, b.dy, b.dz].every(Number.isFinite)) continue;
              const selected = selectedIds.value.includes(b.id),
                invalid = memberErrors(b.id).length > 0,
                color = invalid ? "#c1816b" : b.color;
              const shape = [clean(b.dx), clean(b.dy), clean(b.dz)].join("|");
              let mesh = meshCache.get(b.id);
              if (mesh && mesh.userData.shape !== shape) {
                meshGroup.remove(mesh);
                mesh.traverse((o) => {
                  o.geometry?.dispose();
                  o.material?.dispose();
                });
                meshCache.delete(b.id);
                mesh = null;
              }
              if (!mesh) {
                mesh = new THREE.Mesh(
                  new THREE.BoxGeometry(clean(b.dx), clean(b.dy), clean(b.dz)),
                  new THREE.MeshStandardMaterial({ color, roughness: 0.7, transparent: true }),
                );
                mesh.userData.id = b.id;
                mesh.userData.shape = shape;
                mesh.add(
                  new THREE.LineSegments(
                    new THREE.EdgesGeometry(mesh.geometry),
                    new THREE.LineBasicMaterial(),
                  ),
                );
                meshCache.set(b.id, mesh);
                meshGroup.add(mesh);
              }
              mesh.material.color.set(color); // 选中件：不透明 + 明显蓝色自发光 + 深蓝描边；未选中件压暗，保证一眼可辨。
              mesh.material.opacity = selected ? 1 : 0.6;
              mesh.material.emissive.set(selected ? 0x1b6bb0 : 0x000000);
              mesh.material.emissiveIntensity = selected ? 0.55 : 0;
              mesh.children[0].material.color.set(
                selected ? 0x0f5f9e : invalid ? 0xa84d36 : 0x536f82,
              );
              mesh.position.set(b.x + b.dx / 2, ph + b.y + b.dy / 2, b.z + b.dz / 2);
            }
          }
          function resize() {
            if (!viewport.value || !canvas) return;
            const w = viewport.value.clientWidth,
              h = viewport.value.clientHeight;
            if (!w || !h) return;
            if (renderer) {
              renderer.setSize(w, h, false);
              camera.aspect = w / h;
              camera.updateProjectionMatrix();
              fitOrtho();
            } else queueDraw();
          }
          function fitOrtho() {
            if (!ortho) return;
            const { L, W, H } = frameSize(),
              aspect = Math.max(
                0.1,
                viewport.value.clientWidth / Math.max(1, viewport.value.clientHeight),
              ),
              span =
                view.value === "top"
                  ? Math.max(W, L / aspect)
                  : view.value === "front"
                    ? Math.max(H, W / aspect)
                    : Math.max(H, L / aspect);
            ortho.left = -span * aspect * 0.67;
            ortho.right = span * aspect * 0.67;
            ortho.top = span * 0.67;
            ortho.bottom = -span * 0.67;
            ortho.updateProjectionMatrix();
          }
          function fitView() {
            if (!group.value || !camera) {
              queueDraw();
              return;
            }
            const { L, W, H } = frameSize(),
              target = new THREE.Vector3(L / 2, H / 2, W / 2),
              dist = Math.max(L, W, H) * 2;
            const dir =
              view.value === "front"
                ? new THREE.Vector3(1, 0, 0)
                : view.value === "side"
                  ? new THREE.Vector3(0, 0, 1)
                  : view.value === "top"
                    ? new THREE.Vector3(0, 1, 0)
                    : new THREE.Vector3(1, 0.9, 1.2).normalize();
            const next = view.value === "iso" ? camera : ortho;
            next.up.set(0, 1, 0);
            if (view.value === "top") next.up.set(0, 0, -1);
            next.position.copy(target).addScaledVector(dir, dist);
            next.lookAt(target);
            next.near = 1;
            next.far = dist * 6;
            next.zoom = 1;
            next.updateProjectionMatrix();
            controls.object = next;
            controls.target.copy(target);
            controls.enableRotate = view.value === "iso";
            controls.update();
            fitOrtho();
            queueDraw();
          }
          function setView(mode) {
            view.value = mode;
            fitView();
          }
          function animate() {
            raf = requestAnimationFrame(animate);
            if (!renderer || document.hidden) return;
            controls.update();
            renderer.render(scene, controls.object);
          }
          let zoomQueue = 0,
            zoomRaf = 0,
            zoomNdc = null;
          function onZoom(event) {
            if (busy.value || fallback.value || !controls || drag) return;
            event.preventDefault();
            event.stopImmediatePropagation();
            const rect = canvas.getBoundingClientRect();
            zoomNdc.set(
              ((event.clientX - rect.left) / Math.max(1, rect.width)) * 2 - 1,
              -(((event.clientY - rect.top) / Math.max(1, rect.height)) * 2 - 1),
            );
            zoomQueue += event.deltaY;
            if (!zoomRaf)
              zoomRaf = requestAnimationFrame(() => {
                zoomRaf = 0;
                applyPointerZoom(zoomQueue);
                zoomQueue = 0;
              });
          }
          function cursorTargets(cam, ndc, depthOf) {
            if (cam.isPerspectiveCamera) {
              const far = new THREE.Vector3(ndc.x, ndc.y, 1).unproject(cam),
                dir = far.sub(cam.position).normalize(),
                t = depthOf.clone().sub(cam.position).dot(dir);
              return cam.position.clone().addScaledVector(dir, t);
            }
            const origin = new THREE.Vector3(ndc.x, ndc.y, 0.5).unproject(cam),
              dir = cam.getWorldDirection(new THREE.Vector3()),
              t = depthOf.clone().sub(origin).dot(dir);
            return origin.clone().addScaledVector(dir, t);
          }
          function applyPointerZoom(delta) {
            if (fallback.value || !controls || !renderer) return;
            const cam = controls.object,
              ndc = zoomNdc.clone(),
              oldTarget = controls.target.clone(),
              before = cursorTargets(cam, ndc, oldTarget);
            if (cam.isPerspectiveCamera) {
              const offset = cam.position.clone().sub(oldTarget),
                length = Math.min(
                  controls.maxDistance,
                  Math.max(controls.minDistance, offset.length() * Math.exp(delta * 0.0013)),
                );
              if (Math.abs(length - offset.length()) < 0.0001) return;
              cam.position.copy(oldTarget).addScaledVector(offset.normalize(), length);
              cam.updateMatrixWorld();
            } else if (cam.isOrthographicCamera) {
              const zoom = Math.min(
                controls.maxZoom,
                Math.max(controls.minZoom, cam.zoom * Math.exp(-delta * 0.0013)),
              );
              if (Math.abs(zoom - cam.zoom) < 1e-12) return;
              cam.zoom = zoom;
              cam.updateProjectionMatrix();
              cam.updateMatrixWorld();
            } else return;
            const after = cursorTargets(cam, ndc, oldTarget);
            controls.target.add(before.sub(after));
            controls.update();
            renderer.render(scene, cam);
          }
          function ray(event) {
            const rect = canvas.getBoundingClientRect();
            pointer.set(
              ((event.clientX - rect.left) / rect.width) * 2 - 1,
              (-(event.clientY - rect.top) / rect.height) * 2 + 1,
            );
            raycaster.setFromCamera(pointer, controls.object);
            return raycaster;
          }
          function snapped(v) {
            return Number(snap.value) > 0
              ? Math.round(v / Number(snap.value)) * Number(snap.value)
              : v;
          }
          function pointerDown(event) {
            if (busy.value || event.button !== 0) return;
            if (fallback.value) {
              const rect = canvas.getBoundingClientRect(),
                px = ((event.clientX - rect.left) * canvas.width) / rect.width,
                py = ((event.clientY - rect.top) * canvas.height) / rect.height,
                ctx = canvas.getContext("2d");
              let hit = null;
              for (const h of [...fallbackHits].reverse()) {
                ctx.beginPath();
                h.points.forEach((p, i) => (i ? ctx.lineTo(...p) : ctx.moveTo(...p)));
                ctx.closePath();
                if (ctx.isPointInPath(px, py)) {
                  hit = h;
                  break;
                }
              }
              if (!hit) return;
              select(hit.item.id, event.ctrlKey || event.metaKey);
              if (
                view.value === "top" &&
                tool.value === "move" &&
                !event.ctrlKey &&
                !event.metaKey
              ) {
                const m = selected.value,
                  scale =
                    (((hit.points[1][0] - hit.points[0][0]) / hit.item.dx) * rect.width) /
                    canvas.width;
                checkpoint();
                drag = {
                  type: "fallback",
                  id: m.id,
                  cx: event.clientX,
                  cz: event.clientY,
                  x: m.x,
                  z: m.z,
                  scale,
                  members: selectionOrigins(),
                };
                canvas.setPointerCapture(event.pointerId);
              }
              return;
            }
            const hit = ray(event).intersectObjects(meshGroup.children, false)[0];
            if (!hit) return;
            if (event.ctrlKey || event.metaKey) {
              select(hit.object.userData.id, true);
              return;
            }
            if (!selectedIds.value.includes(hit.object.userData.id)) select(hit.object.userData.id);
            if (tool.value !== "move") return;
            const m = selected.value,
              { ph } = frameSize(),
              plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -(ph + m.y)),
              point = new THREE.Vector3();
            if (!raycaster.ray.intersectPlane(plane, point)) return;
            checkpoint();
            drag = {
              id: m.id,
              plane,
              point: point.clone(),
              x: m.x,
              z: m.z,
              members: selectionOrigins(),
            };
            controls.enabled = false;
            canvas.setPointerCapture(event.pointerId);
          }
          function pointerMove(event) {
            if (!drag) return;
            if (drag.type === "fallback") {
              translateSelection(
                {
                  x: snapped(drag.x + (event.clientX - drag.cx) / drag.scale) - drag.x,
                  z: snapped(drag.z + (event.clientY - drag.cz) / drag.scale) - drag.z,
                },
                drag.members,
              );
              return;
            }
            const point = new THREE.Vector3();
            if (!ray(event).ray.intersectPlane(drag.plane, point)) return;
            const m = mutableMembers().find((m) => m.id === drag.id),
              [dx, , dz] = PalletGeometry.dims(memberSource(m), m.orientation);
            let x = snapped(drag.x + point.x - drag.point.x),
              z = snapped(drag.z + point.z - drag.point.z);
            if (magnet.value) {
              const tol = Math.max(Number(snap.value) || 10, 10),
                other = validation.value.boxes.filter((b) => !selectedIds.value.includes(b.id)),
                xs = [
                  0,
                  dimensions.value.length - dx,
                  ...other.flatMap((b) => [b.x - dx, b.x + b.dx]),
                ],
                zs = [
                  0,
                  dimensions.value.width - dz,
                  ...other.flatMap((b) => [b.z - dz, b.z + b.dz]),
                ];
              const closest = (v, a) =>
                a.reduce(
                  (best, n) => (Math.abs(n - v) < Math.abs(best - v) ? n : best),
                  v + tol * 2,
                );
              const xx = closest(x, xs),
                zz = closest(z, zs);
              if (Math.abs(xx - x) <= tol) x = xx;
              if (Math.abs(zz - z) <= tol) z = zz;
            }
            translateSelection({ x: x - drag.x, z: z - drag.z }, drag.members);
          }
          function pointerUp(event) {
            if (!drag) return;
            const note = drag.note;
            drag = null;
            if (note) notify(note, "error");
            if (controls) controls.enabled = true;
            try {
              canvas.releasePointerCapture(event.pointerId);
            } catch (_) {}
            checkpoint();
          }
          function keydown(event) {
            const input = /^(input|textarea|select)$/i.test(event.target?.tagName),
              ctrl = event.ctrlKey || event.metaKey,
              key = event.key.toLowerCase();
            if (key === "escape") {
              event.preventDefault();
              busy.value ? cancelWorker() : cancel();
              return;
            }
            if (ctrl && key === "s") {
              event.preventDefault();
              save(!event.shiftKey);
              return;
            }
            if (key === "f1") {
              event.preventDefault();
              notify(
                "F5 混排 · Ctrl+S 保存参与 · Ctrl+Shift+S 停用草稿 · Ctrl+Z/Y 撤销重做 · Ctrl 多选 · 方向键移动 · PageUp/Down 升降一层 · Shift+PageUp/Down 微调高度 · R 旋转 · Esc 取消",
              );
              return;
            }
            if (key === "f5") {
              event.preventDefault();
              if (!busy.value && viewMembers.value.length) arrangeWasm();
              return;
            }
            if (ctrl && !input && key === "z") {
              event.preventDefault();
              event.shiftKey ? redo() : undo();
              return;
            }
            if (ctrl && !input && key === "y") {
              event.preventDefault();
              redo();
              return;
            }
            if (ctrl && !input && key === "a") {
              event.preventDefault();
              selectedIds.value = viewMembers.value.map((m) => m.id);
              return;
            }
            if (ctrl && !input && key === "d") {
              event.preventDefault();
              copySelected();
              return;
            }
            if (input || busy.value) return;
            if (key === "delete") {
              event.preventDefault();
              deleteSelected();
              return;
            }
            if (key === "r") {
              event.preventDefault();
              rotateSelected();
              return;
            }
            if ((key === "pageup" || key === "pagedown") && selectedIds.value.length) {
              event.preventDefault();
              const dir = key === "pageup" ? 1 : -1;
              if (event.shiftKey) moveSelection("y", dir * Math.max(1, Number(snap.value) || 10));
              else moveLayer(dir);
              return;
            }
            const moves = {
              arrowleft: ["x", -1],
              arrowright: ["x", 1],
              arrowup: ["z", -1],
              arrowdown: ["z", 1],
            };
            if (moves[key] && selectedIds.value.length) {
              event.preventDefault();
              const [axis, dir] = moves[key];
              moveSelection(axis, dir * Math.max(1, Number(snap.value) || 10));
            }
          }
          async function receive(event) {
            if (event.source !== parent) return;
            const d = event.data || {};
            if (d.kind === "pallet-editor:rejected" && d.channel === channel) {
              notify(d.message, "error");
              return;
            }
            if (d.kind !== "pallet-editor:init" || !d.channel) return;
            if (initialized.value && channel === d.channel) return;
            channel = d.channel;
            items.value = d.items || [];
            group.value = PalletGeometry.copy(d.group);
            currentCopy.value = 1;
            wasmBuffer = d.wasmBuffer;
            workerSource = d.workerSource;
            sourceId.value = items.value.find((i) => i.qty > 0)?.uid || null;
            selectedIds.value = group.value.members.length ? [group.value.members[0].id] : [];
            initialized.value = true;
            history.value = [];
            historyIndex.value = -1;
            checkpoint();
            if (d.fontBase64) {
              try {
                const s = atob(d.fontBase64),
                  a = new Uint8Array(s.length);
                for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
                const face = new FontFace("ClassicCN", a.buffer);
                await face.load();
                document.fonts.add(face);
              } catch (_) {}
            }
            await nextTick();
            initVisual();
          }
          window.addEventListener("message", receive);
          window.addEventListener("keydown", keydown);
          window.addEventListener("beforeunload", () => {
            cleanupWorker();
            if (raf) cancelAnimationFrame(raf);
            if (zoomRaf) cancelAnimationFrame(zoomRaf);
            observer?.disconnect();
            controls?.dispose();
            renderer?.dispose();
            renderer?.forceContextLoss();
          });
          watch(
            () => validation.value.errors.length,
            (n, o) => {
              if (n && n !== o) {
                propsTab.value = "check";
              }
            },
          );
          watch(selectedIds, (n) => {
            if (n.length) {
              propsTab.value = "item";
            }
          });
          watch(
            group,
            () => {
              queueDraw();
              if (!restore && !drag) {
                clearTimeout(historyTimer);
                historyTimer = setTimeout(checkpoint, 400);
              }
            },
            { deep: true },
          );
          watch(selectedIds, queueDraw, { deep: true });
          onMounted(() => parent.postMessage({ kind: "pallet-editor:ready" }, "*"));
          return {
            group,
            items,
            initialized,
            memberListOpen,
            sourceId,
            search,
            addQuantity,
            selectedIds,
            tool,
            view,
            snap,
            magnet,
            viewport,
            fallback,
            message,
            messageKind,
            busy,
            busyLabel,
            history,
            historyIndex,
            fmt,
            views,
            orientationLabels,
            chosenSource,
            filteredItems,
            selected,
            selectedSource,
            counts,
            validation,
            allCopiesCheck,
            copiesProblem,
            canCommit,
            hasBoard,
            dimensions,
            memberSource,
            dimsText,
            thumbnail,
            available,
            memberErrors,
            notify,
            dismissMessage,
            checkpoint,
            undo,
            redo,
            select,
            locateError,
            selectionAllows,
            changeOrientation,
            rotateSelected,
            deleteSelected,
            addPieces,
            copySelected,
            generateGrid,
            dropSelected,
            moveLayer,
            moveSelection,
            setCoordinate,
            motionRegion,
            arrangeWasm,
            repair,
            save,
            cancel,
            cancelWorker,
            setView,
            fitView,
            currentCopy,
            viewMembers,
            copyCustomized,
            customCopyCount,
            switchCopy,
            syncCopies,
            resetCopyToTemplate,
            editorReuse,
            reuseInfo,
            groupUsage,
            layoutScope,
            sourcesOpen,
            propsOpen,
            propsTab,
          };
        },
        template: "#pe-template",
      }).mount("#pe-app");
    </script>
  </body>
